<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkinScan — Ingredient Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8; --dark: #1A1410; --terra: #C4622D;
    --blush: #E8C4A0; --warn: #E8A030; --bad: #C4462A; --good: #4A8C5C;
    --mid: #D4834A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--dark); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* ── HEADER ── */
  header { padding: 20px 20px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid rgba(26,20,16,0.1); }
  /* Logo group: always a vertical stack — title on top, subtitle directly below */
  .logo-group { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.5px; color: var(--terra); line-height: 1.1; }
  .logo-sub { font-size: 10.5px; font-weight: 400; color: rgba(26,20,16,0.38); letter-spacing: 0.1em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
  .db-tag { font-size: 10px; color: rgba(26,20,16,0.3); background: rgba(26,20,16,0.05); border: 1px solid rgba(26,20,16,0.08); border-radius: 20px; padding: 3px 9px; white-space: nowrap; flex-shrink: 0; }

  main { max-width: 500px; margin: 0 auto; padding: 26px 20px 64px; }

  /* ── SECTION LABEL ── */
  .section-label { font-family: 'Syne', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: rgba(26,20,16,0.35); margin-bottom: 10px; }

  /* ── SKIN CHIPS ── */
  .skin-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 26px; }
  .chip { padding: 7px 15px; border-radius: 50px; border: 1.5px solid rgba(26,20,16,0.18); font-size: 13px; cursor: pointer; background: transparent; color: var(--dark); transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .chip:hover { border-color: var(--terra); color: var(--terra); }
  .chip.active { background: var(--terra); border-color: var(--terra); color: white; }

  /* ── SOURCE TABS ── */
  .source-tabs { display: flex; gap: 5px; margin-bottom: 11px; }
  .source-tab { flex: 1; padding: 8px 8px; border-radius: 9px; border: 1.5px solid rgba(26,20,16,0.13); background: transparent; font-family: 'DM Sans', sans-serif; font-size: 12px; color: rgba(26,20,16,0.4); cursor: pointer; transition: all 0.15s; text-align: center; -webkit-tap-highlight-color: transparent; }
  .source-tab:hover { border-color: var(--terra); color: var(--terra); }
  .source-tab.active { background: var(--terra); border-color: var(--terra); color: white; font-weight: 500; }

  /* ── INPUT ── */
  .input-wrapper { position: relative; margin-bottom: 6px; }

  textarea:focus { border-color: var(--terra); }
  textarea::placeholder { color: rgba(26,20,16,0.28); }
  /* Both icon buttons share the same pill — mic on right, camera left of it */
  .input-icons { position: absolute; right: 9px; top: 9px; display: flex; gap: 5px; }
  .icon-btn { width: 33px; height: 33px; border-radius: 50%; border: none; background: var(--blush); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.15s; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
  .icon-btn:hover { background: var(--terra); transform: scale(1.08); }
  .icon-btn:hover svg * { stroke: white; }
  .icon-btn.recording { background: var(--bad); animation: pulse 1s infinite; }
  .icon-btn.recording svg * { stroke: white; }
  .icon-btn.photo-active { background: var(--terra); }
  .icon-btn.photo-active svg * { stroke: white; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  /* Widen textarea right padding to make room for two icons */
  textarea { width: 100%; min-height: 86px; background: white; border: 1.5px solid rgba(26,20,16,0.13); border-radius: 13px; padding: 13px 84px 13px 15px; font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.6; color: var(--dark); resize: none; outline: none; transition: border-color 0.2s; }

  /* ── SUGGESTIONS ── */
  .suggestions { display: none; background: white; border: 1.5px solid rgba(26,20,16,0.1); border-radius: 11px; overflow: hidden; margin-bottom: 10px; box-shadow: 0 4px 18px rgba(26,20,16,0.07); }
  .suggestions.show { display: block; }
  .sug-item { display: flex; align-items: center; gap: 11px; padding: 10px 13px; cursor: pointer; border-bottom: 1px solid rgba(26,20,16,0.06); transition: background 0.1s; }
  .sug-item:last-child { border-bottom: none; }
  .sug-item:hover { background: rgba(196,98,45,0.04); }
  .sug-thumb { width: 32px; height: 32px; border-radius: 7px; object-fit: contain; background: rgba(26,20,16,0.05); flex-shrink: 0; }
  .sug-thumb-empty { width: 32px; height: 32px; border-radius: 7px; background: rgba(26,20,16,0.05); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .sug-info { flex: 1; min-width: 0; }
  .sug-name { font-size: 13px; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sug-brand { font-size: 11px; color: rgba(26,20,16,0.38); margin-top: 1px; }
  .sug-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 700; letter-spacing: 0.04em; flex-shrink: 0; text-transform: uppercase; }
  .sug-badge.obf  { background: #EBF5EC; color: var(--good); }
  .sug-badge.inci { background: rgba(196,98,45,0.1); color: var(--terra); }

  .hint { font-size: 11.5px; color: rgba(26,20,16,0.35); margin-bottom: 15px; line-height: 1.5; }

  .analyze-btn { width: 100%; padding: 15px; background: var(--dark); color: white; border: none; border-radius: 13px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14.5px; letter-spacing: 0.04em; cursor: pointer; transition: background 0.2s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
  .analyze-btn:hover { background: var(--terra); }
  .analyze-btn:active { transform: scale(0.985); }

  /* ── LOADING ── */
  .loading { display: none; text-align: center; padding: 48px 0; }
  .loading.show { display: block; }
  .spinner { width: 34px; height: 34px; border: 2.5px solid var(--blush); border-top-color: var(--terra); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-main { font-size: 13px; color: rgba(26,20,16,0.4); font-style: italic; }
  .loading-sub  { font-size: 11px; color: rgba(26,20,16,0.25); margin-top: 4px; }

  /* ══════════════════════════════════════
     RESULTS
  ══════════════════════════════════════ */
  .results { display: none; }
  .results.show { display: block; }

  /* ── Product header ── */
  .r-brand { font-size: 11px; color: var(--terra); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 3px; }
  .r-name  { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.15; margin-bottom: 4px; }
  .r-meta  { font-size: 11.5px; color: rgba(26,20,16,0.35); margin-bottom: 20px; }

  /* ── Verdict banner — one tinted strip, nothing else ── */
  .verdict-banner { border-radius: 12px; padding: 16px 18px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .verdict-banner.safe    { background: #E8F3E9; }
  .verdict-banner.caution { background: #FDF3E3; }
  .verdict-banner.avoid   { background: #FAEAE7; }
  .verdict-left { display: flex; align-items: center; gap: 11px; }
  .verdict-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; font-weight: 700; }
  .safe    .verdict-icon { background: var(--good);   color: white; }
  .caution .verdict-icon { background: var(--warn);   color: white; }
  .avoid   .verdict-icon { background: var(--bad);    color: white; }
  .verdict-text-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
  .safe    .verdict-text-title { color: var(--good); }
  .caution .verdict-text-title { color: #B07000; }
  .avoid   .verdict-text-title { color: var(--bad);  }
  .verdict-text-desc { font-size: 12px; color: rgba(26,20,16,0.5); margin-top: 1px; }
  .verdict-score { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
  .verdict-score-denom { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 400; color: rgba(26,20,16,0.3); }
  .safe    .verdict-score { color: var(--good); }
  .caution .verdict-score { color: var(--warn); }
  .avoid   .verdict-score { color: var(--bad);  }

  /* Skin context — very quiet, below verdict */
  .r-skin-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 22px; margin-top: 8px; }
  .r-skin-label { font-size: 11px; color: rgba(26,20,16,0.3); align-self: center; }
  .r-skin-pill  { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(196,98,45,0.07); color: rgba(196,98,45,0.8); border: 1px solid rgba(196,98,45,0.15); }

  /* ── Category rows — single white card, separated by hairlines ── */
  .cats { background: white; border-radius: 13px; margin-bottom: 18px; overflow: hidden; }
  .cat-row { padding: 13px 16px; border-bottom: 1px solid rgba(26,20,16,0.06); }
  .cat-row:last-child { border-bottom: none; }

  /* Top line: name left, score-num right */
  .cat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .cat-name { font-size: 13px; font-weight: 500; color: var(--dark); }
  .cat-num  { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; }
  .cat-num.c0, .cat-num.c1, .cat-num.c2 { color: var(--good); }
  .cat-num.c3 { color: var(--warn); }
  .cat-num.c4 { color: var(--mid);  }
  .cat-num.c5 { color: var(--bad);  }

  /* Bar — this IS the score, full width, no dots */
  .cat-bar-track { height: 4px; background: rgba(26,20,16,0.07); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
  .cat-bar-fill  { height: 100%; border-radius: 2px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .cat-bar-fill.c0, .cat-bar-fill.c1, .cat-bar-fill.c2 { background: var(--good); }
  .cat-bar-fill.c3 { background: var(--warn); }
  .cat-bar-fill.c4 { background: var(--mid);  }
  .cat-bar-fill.c5 { background: var(--bad);  }

  /* Flagged ingredients — plain list, no colored pills */
  .cat-flagged { font-size: 12px; color: rgba(26,20,16,0.5); line-height: 1.6; }
  .cat-flagged strong { color: var(--dark); font-weight: 500; }
  .cat-ok { font-size: 12px; color: rgba(26,20,16,0.35); font-style: italic; }

  /* ── AI block — minimal, no border-top accent ── */
  .ai-block { background: white; border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; }

  .ai-label { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: rgba(26,20,16,0.35); margin-bottom: 9px; }
  .ai-text  { font-size: 13px; color: rgba(26,20,16,0.62); line-height: 1.7; }
  .ai-dots  { display: flex; align-items: center; gap: 5px; }
  .ai-dot   { width: 4px; height: 4px; border-radius: 50%; background: var(--terra); animation: blink 1.1s infinite; }
  .ai-dot:nth-child(2) { animation-delay: 0.18s; }
  .ai-dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }

  /* ── Not found ── */
  .not-found { background: #FDF3E3; border-radius: 12px; padding: 18px 18px; margin-bottom: 18px; }
  .not-found-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; color: #9A6500; margin-bottom: 5px; }
  .not-found-desc  { font-size: 13px; color: rgba(26,20,16,0.55); line-height: 1.55; }

  /* ── Reset button ── */
  .new-scan { width: 100%; padding: 13px; background: transparent; color: rgba(26,20,16,0.35); border: 1.5px solid rgba(26,20,16,0.12); border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.18s; }
  .attribution { text-align: center; font-size: 11px; color: rgba(26,20,16,0.22); margin-top: 28px; }
  .attribution a { color: rgba(26,20,16,0.3); text-decoration: none; }
  .attribution a:hover { color: var(--terra); }


  /* ── Mobile / touch refinements ── */
  @media (max-width: 500px) {
    main { padding: 20px 16px 80px; }
    header { padding: 18px 16px 14px; }
    .analyze-btn { padding: 17px; font-size: 15px; }
    /* Bigger tap targets on mobile */
    .icon-btn { width: 38px; height: 38px; }
    textarea { padding: 13px 94px 13px 14px; font-size: 15px; }
    .chip { padding: 8px 16px; font-size: 13.5px; }
  }
  /* Prevent iOS bounce / overscroll on the app shell */
  html { height: 100%; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
  /* Remove blue tap highlight globally on mobile */
  * { -webkit-tap-highlight-color: transparent; }
</style>

<body>

<header>
  <div class="logo-group">
    <span class="logo">SkinScan</span>
    <span class="logo-sub">Ingredient Analyzer</span>
  </div>
  <span class="db-tag">OBF + INCIDecoder</span>
</header>

<main>
  <div class="section-label">My skin is</div>
  <div class="skin-chips" id="skinChips">
    <button class="chip" data-type="acne-prone">Acne-prone</button>
    <button class="chip" data-type="sensitive">Sensitive / Reactive</button>
    <button class="chip" data-type="dry">Dry</button>
    <button class="chip" data-type="normal">Normal</button>
  </div>

  <div id="inputSection">
    <div class="section-label">What product?</div>
    <div class="source-tabs">
      <button class="source-tab active" id="tabBoth" onclick="setSource('both')">Both databases</button>
      <button class="source-tab"        id="tabObf"  onclick="setSource('obf')">Open Beauty Facts</button>
      <button class="source-tab"        id="tabInci" onclick="setSource('inci')">INCIDecoder</button>
    </div>
    <div class="input-wrapper">
      <textarea id="productInput" placeholder="Type a product name, or paste the ingredient list…" rows="3"></textarea>
      <div class="input-icons">
        <!-- Camera: opens device camera or file picker -->
        <button class="icon-btn" id="photoBtn" title="Scan ingredient label" onclick="document.getElementById('cameraInput').click()">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M5.5 2L4.5 3.5H2C1.45 3.5 1 3.95 1 4.5V12.5C1 13.05 1.45 13.5 2 13.5H14C14.55 13.5 15 13.05 15 12.5V4.5C15 3.95 14.55 3.5 14 3.5H11.5L10.5 2H5.5Z" stroke="#C4622D" stroke-width="1.3" stroke-linejoin="round"/>
            <circle cx="8" cy="8.5" r="2.5" stroke="#C4622D" stroke-width="1.3"/>
          </svg>
        </button>
        <!-- Mic: voice dictation -->
        <button class="icon-btn" id="micBtn" title="Dictate product name">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <rect x="4.5" y="0.75" width="6" height="8" rx="3" stroke="#C4622D" stroke-width="1.3"/>
            <path d="M2.5 7C2.5 9.761 4.739 12 7.5 12C10.261 12 12.5 9.761 12.5 7" stroke="#C4622D" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="7.5" y1="12" x2="7.5" y2="14.5" stroke="#C4622D" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoUpload(event)">

    <!-- Photo preview (shown after capture) -->
    <div id="photoPreview" style="display:none;margin:8px 0 10px;position:relative">
      <img id="photoImg" style="width:100%;border-radius:10px;max-height:150px;object-fit:cover;border:1.5px solid rgba(196,98,45,0.25)" alt="Ingredient photo">
      <button onclick="clearPhoto()" style="position:absolute;top:7px;right:7px;background:rgba(20,14,10,0.55);border:none;color:white;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:24px;text-align:center;backdrop-filter:blur(4px)">×</button>
      <div style="position:absolute;bottom:7px;left:9px;background:rgba(20,14,10,0.55);color:white;font-size:10.5px;padding:3px 8px;border-radius:20px;backdrop-filter:blur(4px)">Tap Analyze to scan this label — database tabs ignored</div>
    </div>

    <div class="suggestions" id="suggestions"></div>
    <p class="hint" id="searchHint">Photograph a label · Dictate · or paste ingredients</p>

    <button class="analyze-btn" onclick="doScan()">Analyze Ingredients →</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p class="loading-main" id="loadingMain">Searching…</p>
    <p class="loading-sub"  id="loadingSub"></p>
  </div>

  <div class="results" id="results"></div>

  <div class="attribution">
    <a href="https://world.openbeautyfacts.org" target="_blank">Open Beauty Facts</a> &amp; <a href="https://incidecoder.com" target="_blank">INCIDecoder</a> · Photo analysis by Claude Vision
  </div>
</main>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PROXY CONFIG
// Replace YOUR_WORKER_URL with your Cloudflare Worker URL after deploying.
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const PROXY_URL = 'https://skinscan-proxy.kelly-f.workers.dev';

// All Anthropic API calls go through the proxy — no key in the client
function apiUrl()     { return PROXY_URL + '/v1/messages'; }
function authHeaders() {
  return {
    'Content-Type':      'application/json',
    'anthropic-version': '2023-06-01',
    'anthropic-beta':    'web-search-2025-03-05',
  };
}

// ── Search results cache: avoids redundant API calls for repeated queries ──
// Keyed by normalised query string. Entries never expire (session-scoped).
const _searchCache = {};
function cacheKey(prefix, q) { return prefix + ':' + q.toLowerCase().trim().replace(/\s+/g,' '); }
function cacheGet(prefix, q) { return _searchCache[cacheKey(prefix, q)] || null; }
function cacheSet(prefix, q, val) { if (val) _searchCache[cacheKey(prefix, q)] = val; }

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const selectedTypes = new Set();  // nothing pre-selected — user must choose
let activeSource = 'both';
let selectedProduct = null;
let capturedPhotoBase64 = null;   // base64 image data from camera
let lastAnalysisData = null;      // gap #4: store last result for re-analysis
const productInput = document.getElementById('productInput');

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CHIPS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  const t = c.dataset.type;
  selectedTypes.has(t) ? (selectedTypes.delete(t), c.classList.remove('active')) : (selectedTypes.add(t), c.classList.add('active'));
}));

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SOURCE TABS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const hintTexts = {
  both: 'Searches both Open Beauty Facts &amp; INCIDecoder. Tap the mic to dictate.',
  obf:  'Searches Open Beauty Facts only. Tap the mic to dictate.',
  inci: 'Searches INCIDecoder — great for niche &amp; K-beauty. Tap the mic to dictate.',
};
function setSource(src) {
  activeSource = src;
  document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab' + src.charAt(0).toUpperCase() + src.slice(1)).classList.add('active');
  document.getElementById('searchHint').innerHTML = hintTexts[src];
  hideSuggestions(); selectedProduct = null;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// VOICE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const micBtn = document.getElementById('micBtn');
let recognition = null, isRecording = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ── iOS Safari notes ──────────────────────────────────────────────
  // • interimResults:true causes iOS to never fire isFinal=true — keep false
  // • iOS auto-stops after ~6s silence; onend fires before onresult sometimes
  // • We track the best transcript ourselves and commit it in onend
  // ─────────────────────────────────────────────────────────────────
  let pendingTranscript = '';   // best transcript seen so far this session

  function buildRecognition() {
    const r = new SR();
    r.continuous      = false;
    r.interimResults  = false;  // iOS: true breaks final delivery
    r.lang            = 'en-US';
    r.maxAlternatives = 1;

    r.onstart = () => {
      pendingTranscript = '';
      productInput.placeholder = 'Listening…';
    };

    r.onresult = e => {
      // Collect ALL results (not just from resultIndex) so nothing is missed
      let transcript = '';
      for (let i = 0; i < e.results.length; i++) {
        transcript += e.results[i][0].transcript;
      }
      pendingTranscript = transcript.trim();
      productInput.value = pendingTranscript;
    };

    r.onspeechend = () => {
      // Speech finished — stop cleanly (iOS sometimes needs this nudge)
      try { r.stop(); } catch (_) {}
    };

    r.onend = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
      productInput.placeholder = 'Type a product name, or paste the ingredient list…';

      // Commit whatever transcript we have (covers iOS where onresult fires late or not at all)
      if (pendingTranscript) {
        productInput.value = pendingTranscript;
        triggerSuggest(pendingTranscript);
      }
      // Rebuild for next use (iOS reuses of the same instance are unreliable)
      recognition = buildRecognition();
    };

    r.onerror = e => {
      isRecording = false;
      micBtn.classList.remove('recording');
      productInput.placeholder = 'Type a product name, or paste the ingredient list…';
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        console.warn('Speech recognition error:', e.error);
      }
      recognition = buildRecognition();
    };

    return r;
  }

  recognition = buildRecognition();

  micBtn.addEventListener('click', () => {
    if (isRecording) {
      try { recognition.stop(); } catch (_) {}
    } else {
      isRecording = true;
      micBtn.classList.add('recording');
      try { recognition.start(); }
      catch (err) {
        // Already started or not allowed — reset
        isRecording = false;
        micBtn.classList.remove('recording');
        recognition = buildRecognition();
      }
    }
  });

} else {
  micBtn.style.opacity = '0.3';
  micBtn.title = 'Speech recognition not supported on this browser';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PHOTO / CAMERA MODE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  // Resize + convert to JPEG via canvas (handles HEIC, PNG, WebP, large photos)
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (e) => {
    img.onload = () => {
      // Resize to max 1400px on longest side (enough for text OCR, small enough for API)
      const MAX = 1400;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else       { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // Export as JPEG (works universally, ~80% quality keeps text sharp)
      const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.82);
      capturedPhotoBase64 = jpegDataUrl.split(',')[1];

      // Show preview
      document.getElementById('photoImg').src = jpegDataUrl;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoBtn').classList.add('photo-active');
      productInput.value = '';
      selectedProduct = null;
      hideSuggestions();
      // gap #8: dim source tabs when photo staged
      document.querySelector('.source-tabs').style.opacity = '0.35';
      document.querySelector('.source-tabs').style.pointerEvents = 'none';
    };
    img.onerror = () => {
      // Fallback: send raw if canvas fails (shouldn't happen)
      const dataUrl = e.target.result;
      capturedPhotoBase64 = dataUrl.split(',')[1];
      document.getElementById('photoImg').src = dataUrl;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoBtn').classList.add('photo-active');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}
function clearPhoto() {
  capturedPhotoBase64 = null;
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('photoImg').src = '';
  document.getElementById('photoBtn').classList.remove('photo-active');
  // gap #8: restore source tabs
  document.querySelector('.source-tabs').style.opacity = '';
  document.querySelector('.source-tabs').style.pointerEvents = '';
}

// ── analyzePhoto: send image to Claude Vision, extract ingredients ──
// Images are pre-processed to JPEG by handlePhotoUpload (resize + compress)
async function analyzePhoto(base64Image) {
  async function visionCall(prompt) {
    const res = await fetch(apiUrl(), {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1500,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64Image } },
          { type: 'text', text: prompt }
        ]}]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  }

  try {
    const prompt1 = 'Look at this photo of a cosmetic product. Find the ingredient list (small text on the back/side, starting with "Ingredients:" or "INGREDIENTS:"). Read every ingredient name separated by commas. Reply with ONLY these three lines — no extra text:\nPRODUCT: [product name or Unknown Product]\nBRAND: [brand or blank]\nINGREDIENTS: [full comma-separated ingredient list]\nIf no ingredient list is visible, reply: NOT_FOUND';

    const text1 = await visionCall(prompt1);

    if (!text1.includes('NOT_FOUND') && text1.includes('INGREDIENTS:')) {
      const pm = text1.match(/PRODUCT:\s*(.+)/i);
      const bm = text1.match(/BRAND:\s*(.+)/i);
      const im = text1.match(/INGREDIENTS:\s*([\s\S]+)/i);
      if (im && im[1].trim().length > 10) {
        return { productName: pm ? pm[1].trim() : 'Unknown Product', brand: bm ? bm[1].trim() : '', ingredients: im[1].trim().split('\n')[0] };
      }
    }

    // Retry with a broader prompt
    const prompt2 = 'This is a cosmetic product packaging photo. Please read ALL visible text and find any ingredient names (chemical/botanical names separated by commas). Start your reply with "INGREDIENTS:" then list them comma-separated on one line. If you see a product name, add PRODUCT: [name] on the next line.';
    const text2 = await visionCall(prompt2);

    const pm2 = text2.match(/PRODUCT:\s*(.+)/i);
    const bm2 = text2.match(/BRAND:\s*(.+)/i);
    const im2 = text2.match(/INGREDIENTS:\s*([\s\S]+)/i);
    if (im2 && im2[1].trim().length > 10) {
      return { productName: pm2 ? pm2[1].trim() : 'Unknown Product', brand: bm2 ? bm2[1].trim() : '', ingredients: im2[1].trim().split('\n')[0] };
    }

    return { error: "Couldn't read the ingredient list clearly. Try a closer shot with the label flat, good lighting, and text in focus." };
  } catch(e) {
    console.error('analyzePhoto error:', e);
    return { error: 'Connection error. Check your internet and try again.' };
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SUGGESTIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const suggestionsEl = document.getElementById('suggestions');
let searchTimeout = null;
productInput.addEventListener('input', () => {
  const val = productInput.value.trim();
  selectedProduct = null;
  clearTimeout(searchTimeout);
  if (val.length >= 3 && !val.includes(',') && val.length < 80)
    searchTimeout = setTimeout(() => triggerSuggest(val), 400);
  else hideSuggestions();
});
// Enter key = analyze (Shift+Enter = newline)
productInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    clearTimeout(searchTimeout);
    hideSuggestions();
    doScan();
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('#productInput') && !e.target.closest('#suggestions')) hideSuggestions();
});
function hideSuggestions() {
  suggestionsEl.classList.remove('show');
  suggestionsEl.innerHTML = '';
  suggestionsEl._products = [];
}
async function triggerSuggest(query) {
  const searches = [];
  if (activeSource !== 'inci') searches.push(searchOBF(query));
  if (activeSource !== 'obf')  searches.push(searchINCI(query));
  const settled = await Promise.allSettled(searches);
  let results = [];
  settled.forEach(r => { if (r.status === 'fulfilled' && r.value) results.push(...r.value); });
  const seen = new Set();
  results = results.filter(p => { const k = p.name.toLowerCase().slice(0,40); if (seen.has(k)) return false; seen.add(k); return true; });
  results.length ? showSuggestions(results.slice(0, 7)) : hideSuggestions();
}
async function searchOBF(query) {
  try {
    const url = `https://world.openbeautyfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=6&fields=product_name,brands,ingredients_text,image_small_url`;
    const res = await fetch(url, { headers: { 'User-Agent': 'SkinScan/1.0 (skinscan@example.com)' } });
    const data = await res.json();
    return (data.products || [])
      .filter(p => p.product_name && p.ingredients_text?.length > 20)
      .map(p => ({ name: p.product_name, brand: p.brands || '', ingredientsText: p.ingredients_text, img: p.image_small_url || '', source: 'obf' }));
  } catch(e) { return []; }
}
// ── Popular product slug cache — instant, zero API calls ──
const SLUG_CACHE = {

function getCachedSlug(q) {
  q = q.toLowerCase();
  for (const [key, slug] of Object.entries(SLUG_CACHE)) {
    if (q.includes(key)) return slug;
  }
  return null;
}

// ── searchINCIBySnippet ──
// Does ONE web_search call with tool_choice:any so it reliably fires.
// Reads the raw search result content blocks (tool_result) — which contain
// full ingredient lists in their snippets — instead of asking Claude to
// generate formatted output. Much more reliable.
async function searchINCIBySnippet(query) {
  const cached = cacheGet('inci', query);
  if (cached) return cached;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);
  try {
    const res = await fetch(apiUrl(), {
      method: 'POST', headers: authHeaders(), signal: controller.signal,
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 2000,
        tools: [{ type: 'web_search_20250305', name: 'web_search', allowed_domains: ['incidecoder.com'] }],
        messages: [{ role: 'user', content:
          'Find "' + query.replace(/"/g, '') + '" on incidecoder.com and return its full ingredient list.' +
          '\nRespond with exactly:\nPRODUCT: <full name>\nBRAND: <brand>\nINGREDIENTS: <comma-separated INCI list>'
        }],
      }),
    });
    clearTimeout(timer);
    const data = await res.json();
    if (data.error) { console.error('[inci] error:', data.error); return null; }
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    console.log('[inci] response:', text.slice(0, 200));
    return parseSearchResult(text, query);
  } catch(e) {
    clearTimeout(timer);
    console.error('[inci] exception:', e.message);
    return null;
  }
}

function parseSearchResult(text, fallbackQuery) {
  const productMatch     = text.match(/PRODUCT:\s*(.+)/i);
  const brandMatch       = text.match(/BRAND:\s*(.+)/i);
  const ingredientsMatch = text.match(/INGREDIENTS:\s*([\s\S]+)/i);
  if (!ingredientsMatch || ingredientsMatch[1].trim().length < 20) {
    console.warn('[search] no INGREDIENTS line. text was:', text.slice(0, 300));
    return null;
  }
  const result = {
    productName: productMatch ? productMatch[1].trim() : fallbackQuery,
    brand:       brandMatch   ? brandMatch[1].trim()   : '',
    ingredients: ingredientsMatch[1].trim().split('\n')[0],
  };
  cacheSet('inci', fallbackQuery, result);
  return result;
}

// ── searchINCI: for the dropdown suggestions ──
async function searchINCI(query) {
  const cachedSlug = getCachedSlug(query);
  if (cachedSlug) {
    const name = cachedSlug.split('-').map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(' ').replace(/\bTm\b/, '™');
    return [{ name, brand:'', ingredientsText:'', img:'', source:'inci', slug: cachedSlug }];
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch(apiUrl(), {
      method: 'POST', headers: authHeaders(), signal: controller.signal,
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 600,
        tools: [{ type: 'web_search_20250305', name: 'web_search', allowed_domains: ['incidecoder.com'] }],
        messages: [{ role: 'user', content:
          'Search incidecoder.com for: ' + query.replace(/"/g,'') +
          '\nReturn up to 4 matching products as a raw JSON array only:\n[{"name":"...","brand":"...","slug":"url-slug"}]\nReturn [] if none.'
        }],
      }),
    });
    clearTimeout(timer);
    const data = await res.json();
    if (data.error) return [];
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    return parseSlugList(text);
  } catch(e) { clearTimeout(timer); return []; }
}

function parseSlugList(text) {
  const clean = text.replace(/```json|```/gi, '').trim();
  const match = clean.match(/\[[\s\S]*\]/);
  if (!match) return [];
  try {
    return JSON.parse(match[0])
      .filter(p => p.slug)
      .map(p => ({ name: p.name||p.slug, brand: p.brand||'', ingredientsText:'', img:'', source:'inci', slug: p.slug }));
  } catch(e) { return []; }
}

// ── fetchInciIngredients ──
// For a known slug: one search call, read ingredients from snippet.
// For an unknown query (isQuery=true): same but also resolves the product.
async function fetchInciIngredients(slugOrQuery, isQuery = false) {
  // Cache shortcut
  if (isQuery) {
    const cachedSlug = getCachedSlug(slugOrQuery);
    if (cachedSlug) return fetchInciIngredients(cachedSlug, false);
  }

  const searchQuery = isQuery
    ? 'site:incidecoder.com/products ' + slugOrQuery
    : 'site:incidecoder.com/products/' + slugOrQuery;

  return searchINCIBySnippet(isQuery ? slugOrQuery : slugOrQuery.replace(/-/g, ' '));
}


function showSuggestions(products) {
  suggestionsEl._products = products;
  suggestionsEl.innerHTML = products.map((p,i) => `
    <div class="sug-item" onclick="pickProduct(${i})">
      ${p.img ? `<img class="sug-thumb" src="${escHtml(p.img)}" alt="" onerror="this.style.display='none'">` : `<div class="sug-thumb-empty">${p.source==='inci'?'◆':'◇'}</div>`}
      <div class="sug-info">
        <div class="sug-name">${escHtml(p.name)}</div>
        ${p.brand?`<div class="sug-brand">${escHtml(p.brand)}</div>`:''}
      </div>
      <span class="sug-badge ${p.source}">${p.source==='inci'?'INCIDecoder':'OBF'}</span>
    </div>`).join('');
  suggestionsEl.classList.add('show');
}
async function pickProduct(i) {
  const p = suggestionsEl._products[i];
  selectedProduct = {...p};
  productInput.value = p.name + (p.brand ? ' — ' + p.brand : '');
  hideSuggestions();

  // If INCI product has no ingredients yet, fetch them first then go straight to analysis
  if (p.source === 'inci' && !p.ingredientsText && p.slug) {
    document.getElementById('inputSection').style.display = 'none';
    document.getElementById('loading').classList.add('show');
    document.getElementById('results').classList.remove('show');
    document.getElementById('results').innerHTML = '';
    setLoading('Fetching ingredients…', p.name);
    const result = await fetchInciIngredients(p.slug);
    if (result?.ingredients) {
      selectedProduct.ingredientsText = result.ingredients;
      selectedProduct.name = result.productName || p.name;
      selectedProduct.brand = result.brand || p.brand;
      await runAnalysis(selectedProduct.name, selectedProduct.brand, selectedProduct.ingredientsText, 'INCIDecoder');
    } else {
      // Fetch failed — return to input so user can try manually
      document.getElementById('loading').classList.remove('show');
      document.getElementById('inputSection').style.display = '';
    }
    return;
  }

  // OBF products already have ingredientsText — go straight to analysis
  if (p.ingredientsText) {
    document.getElementById('inputSection').style.display = 'none';
    document.getElementById('loading').classList.add('show');
    document.getElementById('results').classList.remove('show');
    document.getElementById('results').innerHTML = '';
    await runAnalysis(p.name, p.brand || '', p.ingredientsText, 'Open Beauty Facts');
    return;
  }

  // No ingredients yet and no slug — leave at input for manual Analyze tap
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SCORING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function overallScore(cats) {
  if (!cats.length) return 0;
  // Weighted average, weight by importance
  const weighted = cats.reduce((sum, c) => sum + c.score * c.weight, 0);
  const totalW   = cats.reduce((sum, c) => sum + c.weight, 0);
  return Math.min(parseFloat((weighted / totalW).toFixed(1)), 5);
}
function verdictFromScore(s) {
  if (s <= 1.2) return 'safe';
  if (s <= 2.8) return 'caution';
  return 'avoid';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// AI INGREDIENT CHECK (OPTION A)
// One Claude call evaluates EVERY ingredient in the list — no hardcoded
// limit. Returns structured JSON driving all category scores.
// Falls back to hardcoded lists if the call fails.
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function claudeIngredientCheck(ingredients, skinTypes) {
  const concerns = [];
  if (skinTypes.includes('acne-prone'))  concerns.push('acne-prone (comedogenicity, pore-clogging, heavy occlusives)');
  if (skinTypes.includes('sensitive'))   concerns.push('sensitive/reactive (irritants, sensitisers, essential oils, harsh preservatives, EU fragrance allergens)');
  if (skinTypes.includes('dry'))         concerns.push('dry skin (drying agents, alcohol, stripping surfactants, exfoliating acids)');
  concerns.push('EU allergens (the 26 fragrance allergens listed in EU Regulation 1223/2009)');

  const prompt = `You are a cosmetic chemist. Evaluate this INCI ingredient list for: ${concerns.join('; ')}.

INGREDIENTS (${ingredients.length}, descending concentration):
${ingredients.join(', ')}

Respond with ONLY a JSON object — no markdown, no text outside the JSON:
{
  "acne": [{"name": "<exact name from list>", "severity": "high"|"mid", "reason": "<short phrase>"}],
  "sensitive": [{"name": "...", "severity": "high"|"mid", "reason": "..."}],
  "dry": [{"name": "...", "severity": "high"|"mid", "reason": "..."}],
  "allergens": [{"name": "...", "severity": "high"|"mid", "reason": "..."}]
}

Rules:
- Only include keys for concerns listed above. Always include "allergens".
- Use exact ingredient names as they appear above. Empty array [] if nothing flagged.
- acne: Fulton scale 3+, heavy occlusives. sensitive: fragrance, essential oils, known sensitisers, harsh preservatives. dry: drying alcohols, SLS/SLES, strong acids. allergens: EU Regulation 1223/2009 fragrance allergens, parabens, isothiazolinones.`;

  // Hard 20s timeout wrapping the entire call including body read
  return Promise.race([
    (async () => {
      try {
        const res = await fetch(apiUrl(), {
          method: 'POST', headers: authHeaders(),
          body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 1200,
            messages: [{ role: 'user', content: prompt }]
          })
        });
        const rawText = await res.text();
        console.log('[claudeCheck] HTTP status:', res.status);
        console.log('[claudeCheck] Raw response (first 500):', rawText.slice(0, 500));
        let data;
        try { data = JSON.parse(rawText); }
        catch(pe) { console.error('[claudeCheck] JSON parse failed:', pe.message, 'raw:', rawText.slice(0,200)); return null; }
        if (data.error) { console.warn('[claudeCheck] API error:', JSON.stringify(data.error)); return null; }
        const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
        const clean = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
        console.log('[claudeCheck] Claude text output:', clean.slice(0, 300));
        return JSON.parse(clean);
      } catch(e) {
        console.error('[claudeCheck] fetch/parse exception:', e.message);
        return null;
      }
    })(),
    new Promise(resolve => setTimeout(() => { console.warn('[claudeCheck] hard 20s timeout fired'); resolve(null); }, 20000))
  ]);
}

// ── Chemist's note: pure narrative, runs after render ──
async function getChemistNote(productName, ingredients, verdict, skinTypes, aiFlags) {
  const skinList = skinTypes.join(', ') || 'general skin';
  // Pass the AI flags as context so the note doesn't repeat what the rows already say
  const flagSummary = aiFlags
    ? Object.entries(aiFlags)
        .filter(([k]) => k !== 'notes')
        .flatMap(([, arr]) => (arr || []).map(f => f.name))
        .filter((v, i, a) => a.indexOf(v) === i)
        .slice(0, 10)
        .join(', ')
    : '';
  try {
    const res = await fetch(apiUrl(), {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 300,
        messages: [{ role: 'user', content:
          `You are a cosmetic chemist. Write a brief note for someone with ${skinList} skin about this product.

Product: ${productName}
Key flagged ingredients: ${flagSummary || 'none'}
Overall assessment: ${verdict}
First 20 ingredients: ${ingredients.slice(0,20).join(', ')}

Write 2 sentences maximum. Focus on what the user should actually do or watch for. No marketing language. Do not repeat the flagged ingredients list — the user can already see it. You may use **bold** for ingredient names or a Tip label. Keep formatting minimal.`
        }]
      })
    });
    const data = await res.json();
    return data.content?.[0]?.text || null;
  } catch(e) { return null; }
}

// ── isPastedIngredientList: distinguish pasted INCI list from a product name ──
// Requires: 3+ commas AND average token length < 32 chars (INCI names are short).
// This prevents "La Roche-Posay Toleriane Double Repair Face Moisturizer, SPF 30"
// (1 comma, long tokens) from being misread as an ingredient list.
function isPastedIngredientList(text) {
  const commas = (text.match(/,/g) || []).length;
  if (commas < 3) return false;
  const tokens = text.split(',').map(t => t.trim()).filter(Boolean);
  const avgLen = tokens.reduce((s, t) => s + t.length, 0) / tokens.length;
  return avgLen < 32;  // INCI names average ~12 chars; product names much longer
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MAIN SCAN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function doScan() {
  const inputVal = productInput.value.trim();

  // ── Path A: Photo mode ──
  if (capturedPhotoBase64) {
    hideSuggestions();
    document.getElementById('inputSection').style.display = 'none';
    document.getElementById('loading').classList.add('show');
    document.getElementById('results').classList.remove('show');
    document.getElementById('results').innerHTML = '';
    setLoading('Reading ingredient label…', 'Claude Vision is scanning the photo');
    const photoResult = await analyzePhoto(capturedPhotoBase64);
    if (photoResult.error) {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('inputSection').style.display = '';
      document.getElementById('results').innerHTML = `
        <div class="not-found">
          <div class="not-found-title">Couldn't read the label</div>
          <div class="not-found-desc">${escHtml(photoResult.error)}<br><br>Try retaking the photo with better lighting, held flat and close to the text.</div>
        </div>
        <button class="new-scan" onclick="resetScan()">← Try Again</button>`;
      document.getElementById('results').classList.add('show');
      return;
    }
    // Hand off to analysis with photo-sourced data
    await runAnalysis(photoResult.productName, photoResult.brand, photoResult.ingredients, 'Photo');
    return;
  }

  if (!inputVal) { productInput.style.borderColor='var(--bad)'; setTimeout(()=>productInput.style.borderColor='',900); productInput.focus(); return; }

  hideSuggestions();
  document.getElementById('inputSection').style.display = 'none';
  document.getElementById('loading').classList.add('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';

  let productName='', brand='', ingredientsText='', source='';

  if (selectedProduct?.ingredientsText) {
    ({ name: productName, brand: brand = '', ingredientsText, source: source } = selectedProduct);
    source = source === 'inci' ? 'INCIDecoder' : 'Open Beauty Facts';
  } else if (selectedProduct?.source === 'inci' && selectedProduct?.slug) {
    setLoading('Fetching from INCIDecoder…','');
    const r = await fetchInciIngredients(selectedProduct.slug);
    if (r?.ingredients) { productName=r.productName||selectedProduct.name; brand=r.brand||selectedProduct.brand||''; ingredientsText=r.ingredients; source='INCIDecoder'; }
    else productName = selectedProduct.name;
  } else if (isPastedIngredientList(inputVal)) {
    // Pasted ingredient list — use directly (gap #3 fix: smarter detection)
    productName='Custom Product'; ingredientsText=inputVal; source='Pasted';
  } else {
    let found = false;
    // Step 1: Open Beauty Facts (fast, reliable API)
    if (activeSource !== 'inci') {
      setLoading('Searching Open Beauty Facts…','');
      try {
        const url=`https://world.openbeautyfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(inputVal)}&search_simple=1&action=process&json=1&page_size=10&fields=product_name,brands,ingredients_text,image_small_url`;
        const res=await fetch(url,{headers:{'User-Agent':'SkinScan/1.0 (skinscan@example.com)'}});
        const data=await res.json();
        const prods=(data.products||[]).filter(p=>p.ingredients_text?.length>20);
        if (prods.length) {
          // Sort by name-match relevance before picking (gap #2 fix)
          const qWords = inputVal.toLowerCase().split(/\s+/);
          prods.sort((a,b) => {
            const scoreA = qWords.filter(w => (a.product_name||'').toLowerCase().includes(w)).length;
            const scoreB = qWords.filter(w => (b.product_name||'').toLowerCase().includes(w)).length;
            return scoreB - scoreA;
          });
          const p=prods[0]; productName=p.product_name||inputVal; brand=p.brands||''; ingredientsText=p.ingredients_text; source='Open Beauty Facts'; found=true;
        }
      } catch(e){}
    }
    // Step 2: INCIDecoder via search snippet
    if (!found && activeSource !== 'obf') {
      setLoading('Searching INCIDecoder…', '');
      const r = await fetchInciIngredients(inputVal, true);
      if (r?.ingredients) {
        productName=r.productName||inputVal; brand=r.brand||''; ingredientsText=r.ingredients; source='INCIDecoder'; found=true;
      }
    }
    // Step 3: Google fallback — search for "[product name] ingredients" and extract from result
    if (!found) {
      setLoading('Searching the web…', 'trying Google as fallback');
      const r = await googleIngredientsFallback(inputVal);
      if (r?.ingredients) {
        productName=r.productName||inputVal; brand=r.brand||''; ingredientsText=r.ingredients; source='Web'; found=true;
      }
    }
    if (!found) productName = inputVal;
  }

  await runAnalysis(productName, brand, ingredientsText, source);
}

// ── googleIngredientsFallback: last-resort search for any product ──
async function googleIngredientsFallback(query) {
  const cached = cacheGet('google', query);
  if (cached) return cached;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);
  try {
    const res = await fetch(apiUrl(), {
      method: 'POST', headers: authHeaders(), signal: controller.signal,
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 1500,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content:
          'Find the full INCI ingredient list for: ' + query.replace(/"/g,'') +
          '\nSearch INCIDecoder, the brand site, or Sephora.' +
          '\nRespond with exactly:\nPRODUCT: <n>\nBRAND: <brand>\nINGREDIENTS: <comma-separated INCI list>'
        }],
      }),
    });
    clearTimeout(timer);
    const data = await res.json();
    if (data.error) return null;
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const result = parseSearchResult(text, query);
    if (result) cacheSet('google', query, result);
    return result;
  } catch(e) { clearTimeout(timer); return null; }
}

// ── parseIngredients: split INCI string into individual ingredient names ──
function parseIngredients(text) {
  return text.replace(/\*/g, '').split(/,|;|\n/)
    .map(i => i.trim().replace(/^\s*[-·•]\s*/, ''))
    .filter(i => i.length > 2 && i.length < 120);
}

// ── runAnalysis: shared analysis path (text search + photo both end up here) ──
async function runAnalysis(productName, brand, ingredientsText, source) {
  setLoading('Analyzing ingredients…', 'AI is checking every ingredient');
  await new Promise(r => setTimeout(r, 120));

  const ingredients = parseIngredients(ingredientsText);
  if (!ingredients.length) { showNotFound(productName); return; }

  const skinTypes = [...selectedTypes];
  const noSkinWarning = skinTypes.length === 0 || (skinTypes.length === 1 && skinTypes[0] === 'normal');
  const noSkinSelected = selectedTypes.size === 0 || (selectedTypes.size === 1 && selectedTypes.has('normal'));

  // ── Claude evaluates every ingredient ──
  const aiFlags = await claudeIngredientCheck(ingredients, skinTypes);
  if (!aiFlags) {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('inputSection').style.display = '';
    document.getElementById('results').innerHTML = `
      <div class="not-found">
        <div class="not-found-title">Analysis unavailable</div>
        <div class="not-found-desc">The AI check failed or timed out. Check the browser console (F12 → Console) for the exact error — look for lines starting with [claudeCheck].</div>
      </div>
      <button class="new-scan" onclick="resetScan()">← Try Again</button>`;
    document.getElementById('results').classList.add('show');
    return;
  }

  const cats = buildCats(skinTypes, noSkinSelected, aiFlags);
  const overall = cats.length ? overallScore(cats) : 0;
  const verdict = verdictFromScore(overall);

  lastAnalysisData = { productName, brand, ingredientsText, source };
  renderResults({ productName, brand, ingredients, cats, overall, verdict, source, skinTypes, noSkinWarning, dataSource: 'ai' });

  // Chemist's note — short narrative, uses AI flags as context
  getChemistNote(productName, ingredients, verdict, skinTypes, aiFlags).then(text => {
    const el = document.getElementById('aiText');
    if (!el) return;
    if (text) {
      el.innerHTML = `<div class="ai-text">${markdownToHtml(text)}</div>`;
    } else {
      el.innerHTML = '<span style="font-size:12px;color:rgba(26,20,16,0.28);font-style:italic">Note unavailable.</span>';
    }
  });
}


// ── buildCats: construct cats array from Claude's aiFlags ──
// Scoring: high severity = 1.5 pts, mid = 0.8 pts, capped at 5
function buildCats(skinTypes, noSkinSelected, aiFlags) {
  const score = (flagged) => {
    if (!flagged.length) return 0;
    const h = flagged.filter(x => x.severity === 'high').length;
    const m = flagged.length - h;
    return Math.min(Math.round(h * 1.5 + m * 0.8), 5);
  };
  const get = (key) => Array.isArray(aiFlags[key]) ? aiFlags[key] : [];
  const cats = [];

  if (skinTypes.includes('acne-prone')) {
    const f = get('acne');
    cats.push({ key:'acne', name:'Pore-clogging & heavy',
      desc: f.length === 0 ? 'No pore-clogging or occlusive ingredients found.' : null,
      flagged: f, score: score(f), weight: 1.5 });
  }

  if (skinTypes.includes('sensitive')) {
    const f = get('sensitive');
    cats.push({ key:'reactive', name:'Irritants & sensitisers',
      desc: f.length === 0 ? 'No known irritants or sensitisers detected.' : null,
      flagged: f, score: score(f), weight: 1.4 });
  }

  if (skinTypes.includes('dry')) {
    const f = get('dry');
    cats.push({ key:'dry', name:'Drying / stripping',
      desc: f.length === 0 ? 'No harsh drying agents detected.' : null,
      flagged: f, score: score(f), weight: 1.2 });
  }

  const allergens = get('allergens');
  const allergenWeight = noSkinSelected ? 0.6 : 1.0;
  cats.push({ key:'allergen', name:'EU allergens',
    desc: allergens.length === 0 ? 'No EU-listed allergens detected.' : null,
    flagged: allergens, score: score(allergens), weight: allergenWeight });

  return cats;
}

// RENDER

function renderResults({ productName, brand, ingredients, cats, overall, verdict, source, skinTypes, noSkinWarning, dataSource }) {
  document.getElementById('loading').classList.remove('show');

  const skinLabels = { 'acne-prone':'Acne-prone','sensitive':'Sensitive / Reactive','dry':'Dry','normal':'Normal' };

  const verdictMeta = {
    safe:    { icon: '✓', title: 'Looks good',         desc: noSkinWarning ? 'No EU allergens detected.' : 'No significant concerns for your skin type.' },
    caution: { icon: '!', title: 'Use with caution',   desc: noSkinWarning ? 'Some EU allergens present — check if you are sensitive to these.' : 'A few ingredients worth watching for your skin.' },
    avoid:   { icon: '✕', title: 'Not recommended',    desc: noSkinWarning ? 'Multiple EU allergens detected.' : 'Several ingredients are problematic for your skin type.' },
  }[verdict];

  // Category rows — bar + plain-text flagged list
  const catHTML = cats.map(c => {
    const pct = Math.round((c.score / 5) * 100);
    const cls = `c${c.score}`;
    const flagHTML = c.flagged.length
      ? c.flagged.map(f => {
          const dot = f.severity === 'high'
            ? `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-right:4px;vertical-align:middle;flex-shrink:0"></span>`
            : `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:4px;vertical-align:middle;flex-shrink:0"></span>`;
          const reason = f.reason ? `<span style="color:rgba(26,20,16,0.38);font-weight:400"> — ${escHtml(f.reason)}</span>` : '';
          return `<div style="display:flex;align-items:baseline;gap:0;line-height:1.7">${dot}<strong style="font-weight:500">${escHtml(f.name)}</strong>${reason}</div>`;
        }).join('')
      : null;
    return `
      <div class="cat-row">
        <div class="cat-top">
          <span class="cat-name">${c.name}</span>
          <span class="cat-num ${cls}">${c.score} / 5</span>

        ${flagHTML
          ? `<div class="cat-flagged" style="margin-top:4px">${flagHTML}</div>`
          : `<div class="cat-ok">${escHtml(c.desc)}</div>`}
      </div>`;
  }).join('');

  document.getElementById('results').innerHTML = `
    ${brand ? `<div class="r-brand">${escHtml(brand)}</div>` : ''}
    <div class="r-name">${escHtml(productName)}</div>
    <div class="r-meta">${ingredients.length} ingredients · ${escHtml(source)} · <span style="color:${dataSource==='ai'?'var(--good)':'var(--warn)'}">${dataSource==='ai'?'AI-checked':'local database'}</span></div>

    <div class="verdict-banner ${verdict}">
      <div class="verdict-left">
        <div class="verdict-icon">${verdictMeta.icon}</div>
        <div>
          <div class="verdict-text-title">${verdictMeta.title}</div>
          <div class="verdict-text-desc">${verdictMeta.desc}</div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="verdict-score">${overall.toFixed(1)}</div>
        <div class="verdict-score-denom">out of 5</div>
      </div>
    </div>

    <div class="r-skin-row">
      <span class="r-skin-label">For:</span>
      ${skinTypes.length ? skinTypes.map(t=>`<span class="r-skin-pill">${skinLabels[t]||t}</span>`).join('') : '<span class="r-skin-pill">General</span>'}
    </div>

    ${noSkinWarning ? `<div style="background:#FDF3E3;border-radius:10px;padding:12px 15px;margin-bottom:14px;font-size:12.5px;color:#9A6500;line-height:1.5">
      <strong>No skin concern selected.</strong> Only EU allergens are being checked.
      Select a skin type above for a full analysis.
    </div>` : ''}
    <div class="cats">${catHTML}</div>

    <div class="ai-block">
      <div class="ai-label">Chemist's note</div>
      <div id="aiText"><div class="ai-dots"><span class="ai-dot"></span><span class="ai-dot"></span><span class="ai-dot"></span></div></div>
    </div>

    <div style="display:flex;gap:9px;margin-top:4px">
      <button class="new-scan" style="flex:1" onclick="resetScan()">← Scan another</button>
      <button class="new-scan" style="flex:1;border-color:rgba(196,98,45,0.3);color:var(--terra)" onclick="reAnalyze()" title="Re-run with current skin type selection">Re-analyze</button>
    </div>
    <div style="font-size:10.5px;color:rgba(26,20,16,0.25);line-height:1.6;margin-top:14px;text-align:center;padding:0 4px">
      Checks ~120 known problem ingredients. Unlisted ingredients are not evaluated.
      Comedogenicity ratings based on Kligman scale. EU allergens per Regulation 1223/2009.
      Not a substitute for dermatological advice.
    </div>
  `;
  document.getElementById('results').classList.add('show');
}

function resetScan() {
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';
  document.getElementById('inputSection').style.display = '';
  selectedProduct = null; productInput.value = ''; productInput.focus();
  clearPhoto();
  lastAnalysisData = null;
  window.scrollTo({ top:0, behavior:'smooth' });
}
// gap #4: re-run analysis on same product with current chip selection
function reAnalyze() {
  if (!lastAnalysisData) return;
  const { productName, brand, ingredientsText, source } = lastAnalysisData;
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';
  document.getElementById('loading').classList.add('show');
  runAnalysis(productName, brand, ingredientsText, source);
  window.scrollTo({ top:0, behavior:'smooth' });
}
// ── markdownToHtml: lightweight markdown renderer for the Chemist's note ──
// Handles: **bold**, *italic*, line breaks, and **Label:** prefix lines
function markdownToHtml(text) {
  // Escape HTML in the raw text first, then apply markdown transformations
  // We escape char by char so we can selectively allow our own tags
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  return text
    .split('\n')
    .map(line => {
      line = line.trim();
      if (!line) return null;                             // blank lines → skip
      // Apply inline formatting to the line
      line = esc(line)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')   // **bold**
        .replace(/\*([^*]+)\*/g, '<em>$1</em>');               // *italic*
      return `<p style="margin:0 0 6px">${line}</p>`;
    })
    .filter(Boolean)
    .join('');
}

function clearCacheAndRetry() {
  // gap #10: clear all search caches and return to input
  Object.keys(_searchCache).forEach(k => delete _searchCache[k]);
  resetScan();
}
function escHtml(s) {
  return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SERVICE WORKER REGISTRATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
if ('serviceWorker' in navigator) {
  // Inline service worker as a blob — no separate sw.js file needed
  const swCode = `
    const CACHE = 'skinscan-v1';
    const SHELL = ['./'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
      ));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      // Only cache same-origin requests; pass API calls through
      const url = new URL(e.request.url);
      if (url.hostname === 'api.anthropic.com' ||
          url.hostname === 'world.openbeautyfacts.org' ||
          url.hostname === 'fonts.googleapis.com' ||
          url.hostname === 'fonts.gstatic.com') {
        return; // network-only for API/font calls
      }
      e.respondWith(
        caches.match(e.request).then(cached => cached || fetch(e.request).then(resp => {
          const clone = resp.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
          return resp;
        }))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl, { scope: './' })
    .then(() => console.log('SkinScan SW registered'))
    .catch(e => console.log('SW registration skipped:', e.message));
}
