services:
  - type: web
    name: skinscan-resolver-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: codex/coverage-reliability-backend
    rootDir: .
    buildCommand: "echo 'No build step required'"
    startCommand: "node backend/resolver_server.js"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESOLVER_HOST
        value: 0.0.0.0
      - key: AUTO_RESOLVE_ENABLED
        value: true
      - key: STRICT_BRAND_GATE_ENABLED
        value: true
      - key: INGESTION_POLL_INTERVAL_MS
        value: 30000
  - type: web
    name: skinscan-frontend
    runtime: static
    plan: free
    branch: codex/coverage-reliability-backend
    rootDir: .
    buildCommand: "bash scripts/build_pages.sh"
    staticPublishPath: public
    envVars:
      - key: RESOLVER_API_URL
        sync: false
      - key: RESOLVER_API_FALLBACKS
        sync: false
