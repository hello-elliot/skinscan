// MAIN SCAN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function doScan() {
  const inputVal = productInput.value.trim();
  clearTimeout(searchTimeout);
  latestSuggestRequestId += 1;

  // ── Path A: Photo mode ──
  if (capturedPhotoBase64) {
    hideSuggestions();
    document.getElementById('inputSection').style.display = 'none';
    document.getElementById('loading').classList.add('show');
    document.getElementById('results').classList.remove('show');
    document.getElementById('results').innerHTML = '';
    setLoading('Reading ingredient label…', 'Claude Vision is scanning the photo');
    const photoResult = await analyzePhoto(capturedPhotoBase64);
    if (photoResult.error) {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('inputSection').style.display = '';
      document.getElementById('results').innerHTML = `
        <div class="not-found">
          <div class="not-found-title">Couldn't read the label</div>
          <div class="not-found-desc">${escHtml(photoResult.error)}<br><br>Try retaking the photo with better lighting, held flat and close to the text.</div>
        </div>
        <button class="new-scan" onclick="resetScan()">← Try Again</button>`;
      document.getElementById('results').classList.add('show');
      return;
    }
    // Hand off to analysis with photo-sourced data
    await runAnalysis(photoResult.productName, photoResult.brand, photoResult.ingredients, 'Photo', capturedPhotoBase64 || '');
    return;
  }

  // Nudge if no skin type selected (don't block — but show hint briefly)
  const skinHintEl = document.getElementById('skinHint');
  if (selectedTypes.size === 0) {
    if (skinHintEl) { skinHintEl.style.display = 'block'; setTimeout(() => skinHintEl.style.display = 'none', 4000); }
  } else {
    if (skinHintEl) skinHintEl.style.display = 'none';
  }

  if (!inputVal) { productInput.style.borderColor='var(--bad)'; setTimeout(()=>productInput.style.borderColor='',900); productInput.focus(); return; }

  hideSuggestions();
  document.getElementById('inputSection').style.display = 'none';
  document.getElementById('loading').classList.add('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';

  let productName='', brand='', ingredientsText='', source='resolver', resultImage='', resultCategory='';

  if (selectedProduct?.ingredientsText) {
    ({ name: productName, brand: brand = '', ingredientsText, img: resultImage = '', category: resultCategory = '' } = selectedProduct);
  } else if (selectedProduct?.source === 'inci' && selectedProduct?.slug) {
    setLoading('Fetching product details…','');
    const enriched = await enrichCandidateIngredients(selectedProduct);
    if (enriched?.ingredientsText) {
      productName = enriched.name || selectedProduct.name;
      brand = enriched.brand || selectedProduct.brand || '';
      ingredientsText = enriched.ingredientsText;
      resultImage = enriched.img || '';
      resultCategory = enriched.category || selectedProduct.category || '';
    } else {
      showProductNeedsIngredients(selectedProduct);
      return;
    }
  } else if (isPastedIngredientList(inputVal)) {
    // Pasted ingredient list — use directly (gap #3 fix: smarter detection)
    productName='Custom Product'; ingredientsText=inputVal; source='manual';
  } else {
    setLoading('Searching product…', 'Matching brand and product variants');
    const resolution = await resolveProduct(inputVal, { includeWebFallback: true, forSuggest: false });
    if (resolution.state === 'error') {
      setSearchState('error', { query: inputVal });
      document.getElementById('loading').classList.remove('show');
      document.getElementById('inputSection').style.display = '';
      return;
    }
    if (resolution.state === 'not_found') {
      showNotFound(inputVal);
      return;
    }
    if (resolution.state === 'candidate_list') {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('inputSection').style.display = '';
      const unknownBrandCandidates = (resolution.candidates || []).filter(c => Number(c.brandSimilarity || 0) >= 0.55 || Number(c.nameSimilarity || 0) >= 0.86);
      if (resolution.decisionReason === 'unknown_brand' && !unknownBrandCandidates.length) {
        showCandidateStatusMessage('No close match yet. Add a product URL below for fast indexing.');
        showAddProductCapture({
          query: inputVal,
          normalizedQuery: resolution.normalizedQuery || normalizeQuery(inputVal),
          decisionReason: 'unknown_brand'
        });
      } else if (resolution.candidates?.length) {
        const renderedCandidates = resolution.decisionReason === 'unknown_brand'
          ? unknownBrandCandidates
          : (resolution.candidates || []);
        showSuggestions(renderedCandidates, {
          confirmMode: false,
          meta: {
            query: inputVal,
            normalizedQuery: resolution.normalizedQuery || normalizeQuery(inputVal),
            selectionContext: 'search',
            decisionReason: resolution.decisionReason || ''
          }
        });
      } else {
        setSearchState('empty', { query: inputVal });
      }
      trackEvent('search_state_changed', { state: 'candidate_list', decisionReason: resolution.decisionReason || '' });
      return;
    }
    if (resolution.state === 'resolved_medium') {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('inputSection').style.display = '';
      showSuggestions([resolution.product], {
        confirmMode: true,
        meta: { query: inputVal, normalizedQuery: resolution.normalizedQuery || normalizeQuery(inputVal), selectionContext: 'search' }
      });
      trackEvent('product_confirmation_shown', { query: inputVal, confidence: 'medium', decisionReason: resolution.decisionReason || '' });
      return;
    }
    if (resolution.state === 'resolved_high' && resolution.autoResolved === false) {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('inputSection').style.display = '';
      showSuggestions([resolution.product], {
        confirmMode: true,
        meta: { query: inputVal, normalizedQuery: resolution.normalizedQuery || normalizeQuery(inputVal), selectionContext: 'search' }
      });
      trackEvent('product_confirmation_shown', { query: inputVal, confidence: 'high_guarded', decisionReason: resolution.decisionReason || 'guarded_high' });
      return;
    }
    if (resolution.product?.ingredientResolutionState === 'resolving_sync' || resolution.product?.ingredientResolutionState === 'resolving_async') {
      setLoading('Found product. Retrieving ingredients…', 'This usually takes a few seconds');
    }
    const resolved = await enrichCandidateIngredients(resolution.product);
    if (!resolved?.ingredientsText) {
      showProductNeedsIngredients(resolution.product);
      return;
    }
    productName = resolved.name || inputVal;
    brand = resolved.brand || '';
    ingredientsText = resolved.ingredientsText;
    resultImage = resolved.img || '';
    resultCategory = resolved.category || '';
    source = 'resolver';
  }

  await runAnalysis(productName, brand, ingredientsText, source, resultImage, resultCategory);
}

// ── googleIngredientsFallback: last-resort search for any product ──
async function googleIngredientsFallback(query) {
  const cached = cacheGet('google', query);
  if (cached) return cached;
  const allowedDomains = [
    'incidecoder.com',
    'world.openbeautyfacts.org',
    'sephora.com',
    'ulta.com',
    'douglas.com',
    'douglas.de',
    'iciparisxl.com',
    'yesstyle.com',
    'stylevana.com',
    'amazon.com',
    'cultbeauty.com'
  ];
  const prompts = [
    'Find the exact full INCI ingredient list for: ',
    'Find the ingredient list from any trusted beauty retailer or official brand page for: ',
    'Find this product and return ingredients only for: '
  ];

  for (const prefix of prompts) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 22000);
    try {
      const res = await fetch(apiUrl(), {
        method: 'POST', headers: authHeaders(), signal: controller.signal,
        body: JSON.stringify({
          model: 'claude-sonnet-4-6', max_tokens: 1700,
          tools: [{ type: 'web_search_20250305', name: 'web_search', allowed_domains: allowedDomains }],
          messages: [{ role: 'user', content:
            prefix + query.replace(/"/g, '') +
            '\nReturn strictly:\nPRODUCT: <n>\nBRAND: <brand>\nINGREDIENTS: <comma-separated INCI list>\nIf unavailable, output INGREDIENTS: NOT_FOUND'
          }],
        }),
      });
      clearTimeout(timer);
      const data = await res.json();
      if (data.error) continue;
      const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
      const result = parseSearchResult(text, query);
      if (result?.ingredients && result.ingredients.toUpperCase() !== 'NOT_FOUND') {
        cacheSet('google', query, result);
        return result;
      }
    } catch(e) { clearTimeout(timer); }
  }
  return null;
}

// ── parseIngredients: split INCI string into individual ingredient names ──
function parseIngredients(text) {
  // Normalize line endings and common OCR artifacts
  let cleaned = text
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201C\u201D]/g, '"')
    // Remove "INGREDIENTS:" label if present at start
    .replace(/^[\s\S]*?INGREDIENTS?\s*[:：\-]\s*/i, '');

  const tokens = cleaned.split(/,|;|\n/)
    .map(i => i
      .trim()
      .replace(/^[\s\-·•▪▸►*]+/, '')
      .replace(/[.]+$/, '')
      .trim()
    )
    .filter(i => i.length > 1 && i.length < 140);

  // Expand "A AND B" tokens into separate ingredients
  const expanded = [];
  for (const token of tokens) {
    const andMatch = token.match(/^([A-Z][A-Z0-9\-\/\(\)\s]{2,}?)\s+AND\s+([A-Z][A-Z0-9\-\/\(\)\s]{2,})$/);
    if (andMatch) {
      expanded.push(andMatch[1].trim(), andMatch[2].trim());
    } else {
      expanded.push(token);
    }
  }
  return expanded;
}

function loadUnknownQueue() {
  try { return JSON.parse(localStorage.getItem('skinscan_unknown_queue') || '{}'); } catch (_) { return {}; }
}
function saveUnknownQueue(queue) {
  try { localStorage.setItem('skinscan_unknown_queue', JSON.stringify(queue)); } catch (_) {}
}
function updateUnknownQueue(normalizedToken) {
  const queue = loadUnknownQueue();
  const key = hashString(normalizedToken);
  const now = new Date().toISOString();
  if (!queue[key]) {
    queue[key] = { normalizedToken, tokenHash: key, count: 1, firstSeenAt: now, lastSeenAt: now };
  } else {
    queue[key].count += 1;
    queue[key].lastSeenAt = now;
  }
  saveUnknownQueue(queue);
  if (queue[key].count >= 3) {
    trackEvent('unknown_ingredient_priority', { tokenHash: key, count: queue[key].count });
  }
  return queue[key];
}
function logUnknownIngredients(unknownIngredients, source) {
  const seen = new Set();
  const outbound = [];
  for (const raw of unknownIngredients || []) {
    const normalized = normalizeIngredient(raw || '');
    if (!normalized || seen.has(normalized)) continue;
    seen.add(normalized);
    const queueRecord = updateUnknownQueue(normalized);
    outbound.push(normalized);
    trackEvent('unknown_ingredient_seen', {
      tokenHash: hashString(normalized),
      normalizedToken: normalized,
      count: queueRecord.count,
      source,
      ts: new Date().toISOString()
    });
  }
  if (outbound.length) {
    fetch(resolverUrl('/resolver/unknown-ingredients'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: outbound, source: source || 'client' })
    }).catch(() => {});
  }
}

// ── runAnalysis: shared analysis path (text search + photo both end up here) ──
async function runAnalysis(productName, brand, ingredientsText, source, resultImage = '', resultCategory = '') {
  try {
    setLoading('Analyzing ingredients…', 'Checking 2,200+ ingredient database');
    await new Promise(r => setTimeout(r, 80));

    const ingredients = parseIngredients(ingredientsText);
    if (!ingredients.length) { showNotFound(productName); return; }

    const skinTypes = [...selectedTypes];
    const profileMode = profileModeFromTypes(skinTypes);
    const noSkinWarning = profileMode === 'none';

    // ── DB lookup — instant, no API call ──
    const aiFlags = claudeIngredientCheck(ingredients, skinTypes);

    const cats = buildCats(skinTypes, profileMode, aiFlags);
    const unknownCount = (aiFlags._unknown || []).length;
    const overall = cats.length ? overallScore(cats, unknownCount, ingredients.length) : 5;
    const verdict = verdictFromScore(overall);

    lastAnalysisData = { productName, brand, ingredientsText, source, resultImage, resultCategory };
    const unknownIngredients = aiFlags._unknown || [];
    logUnknownIngredients(unknownIngredients, source);
    trackEvent('ingredient_match_type_count', aiFlags._matchTypeCounts || {});
    const { label: confLabel, pct: confPct } = coverageConfidence(ingredients.length, unknownCount);
    renderResults({ productName, brand, ingredients, cats, overall, verdict, source, skinTypes, noSkinWarning, profileMode, dataSource: 'db', unknownIngredients, aiFlags, confLabel, confPct, resultImage, resultCategory });

    // Chemist's note — short narrative (only Claude API call remaining)
    getChemistNote(productName, ingredients, verdict, skinTypes, aiFlags).then(text => {
      const el = document.getElementById('aiText');
      if (!el) return;
      if (text) {
        el.innerHTML = `<div class="ai-text">${markdownToHtml(text)}</div>`;
      } else {
        el.innerHTML = '<span style="font-size:12px;color:rgba(26,20,16,0.28);font-style:italic">Note unavailable.</span>';
      }
    });
  } catch(err) {
    console.error('[runAnalysis]', err);
    document.getElementById('loading').classList.remove('show');
    document.getElementById('inputSection').style.display = '';
    showNotFound(productName || 'this product');
  }
}


// ── Scoring helpers (inverted 5-star: 5=excellent, 1=avoid) ─────────────────
// Each category returns a SAFETY score 1-5 (higher = safer).
// Burden weights per acne scale:
//   acne=5: 3.0  |  acne=4: 2.0  |  acne=3: 1.0  |  acne=2: 0.6
//   acne=1: 0 (informational only — Fulton 1 is clinically negligible)
//   occlusive/wax (acne=0): flagged in list, no burden contribution

function acneSafetyScore(flagged) {
  if (!flagged.length) return 5;
  let burden = 0;
  for (const f of flagged) {
    const a = f.acneVal || 0;  // raw Fulton value attached at flag-time
    if (a >= 5)      burden += 3.0;
    else if (a === 4) burden += 2.0;
    else if (a === 3) burden += 1.0;
    else if (a === 2) burden += 0.6;  // mildly comedogenic
    // acne=1: shown in list as informational, no burden (Fulton 1 = clinically negligible)
    // occlusive/wax acne=0: no burden, flagged via separate branch in claudeIngredientCheck
  }
  if (burden < 0.5) return 5;
  if (burden < 1.0) return 4;
  if (burden < 2.0) return 3;
  if (burden < 3.0) return 2;
  return 1;
}

function genericSafetyScore(flagged) {
  // For irritants, drying, allergens: severity-based, inverted
  if (!flagged.length) return 5;
  const h = flagged.filter(x => x.severity === 'high').length;
  const m = flagged.length - h;
  const burden = h * 2.0 + m * 0.8;
  if (burden < 0.5) return 5;
  if (burden < 1.0) return 4;
  if (burden < 2.0) return 3;
  if (burden < 3.0) return 2;
  return 1;
}

function buildCats(skinTypes, profileMode, aiFlags) {
  const get = (key) => Array.isArray(aiFlags[key]) ? aiFlags[key] : [];
  const cats = [];
  const targetedSelected = skinTypes.some(t => t === 'acne-prone' || t === 'sensitive' || t === 'dry');
  const normalOnly = profileMode === 'normal' && !targetedSelected;

  if (skinTypes.includes('acne-prone')) {
    const f = get('acne');
    cats.push({ key:'acne', name:'Pore-clogging & heavy',
      desc: f.length === 0 ? 'No pore-clogging or occlusive ingredients found.' : null,
      flagged: f, score: acneSafetyScore(f), weight: 1.5 });
  } else if (normalOnly) {
    const f = get('normalAcne');
    cats.push({ key:'acne', name:'Balanced pore-clogging risk',
      desc: f.length === 0 ? 'No moderate/high comedogenic signals detected.' : null,
      flagged: f, score: acneSafetyScore(f), weight: 1.0 });
  }

  if (skinTypes.includes('sensitive')) {
    const f = get('sensitive');
    cats.push({ key:'reactive', name:'Irritants & sensitisers',
      desc: f.length === 0 ? 'No known irritants or sensitisers detected.' : null,
      flagged: f, score: genericSafetyScore(f), weight: 1.4 });
  } else if (normalOnly) {
    const f = get('normalSensitive');
    cats.push({ key:'reactive', name:'Strong irritants',
      desc: f.length === 0 ? 'No strong irritant signals detected for general skin.' : null,
      flagged: f, score: genericSafetyScore(f), weight: 0.9 });
  }

  if (skinTypes.includes('dry')) {
    const f = get('dry');
    cats.push({ key:'dry', name:'Drying / stripping',
      desc: f.length === 0 ? 'No harsh drying agents detected.' : null,
      flagged: f, score: genericSafetyScore(f), weight: 1.2 });
  } else if (normalOnly) {
    const f = get('normalDry');
    cats.push({ key:'dry', name:'Strong drying agents',
      desc: f.length === 0 ? 'No strong drying signals detected for general skin.' : null,
      flagged: f, score: genericSafetyScore(f), weight: 0.8 });
  }

  const allergens = get('allergens');
  const allergenWeight = profileMode === 'none' ? 0.6 : 1.0;
  cats.push({ key:'allergen', name:'EU allergens',
    desc: allergens.length === 0 ? 'No EU-listed allergens detected.' : null,
    flagged: allergens, score: genericSafetyScore(allergens), weight: allergenWeight,
    isAllergen: true });

  return cats;
}

// RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderResults({ productName, brand, ingredients, cats, overall, verdict, source, skinTypes, noSkinWarning, profileMode, dataSource, unknownIngredients, confLabel, confPct, resultImage, resultCategory }) {
  document.getElementById('loading').classList.remove('show');

  const skinLabels = { 'acne-prone':'Acne-prone','sensitive':'Sensitive / Reactive','dry':'Dry','normal':'Normal' };
  const unknown = unknownIngredients || [];

  const _coverageCap = confLabel && confLabel !== 'High';
  const _capNote = _coverageCap
    ? ` Score limited by ${Math.round((confPct||1)*100)}% ingredient coverage.`
    : '';
  // avoid title: driven by the worst-scoring category, not just what skin types are selected
  const _avoidTitle = (() => {
    if (noSkinWarning) return 'Allergens detected';
    // Find the category with the lowest score
    const worstCat = cats.length
      ? cats.reduce((a, b) => a.score <= b.score ? a : b)
      : null;
    if (!worstCat) return 'High risk';
    // Map category key to plain-language title
    const titleMap = {
      acne:     'High pore-clogging risk',
      reactive: 'High irritant risk',
      dry:      'High drying risk',
      allergen: 'Allergens detected',
    };
    // If multiple cats are equally bad (within 1 point), use generic title
    const lowScore = worstCat.score;
    const lowCats = cats.filter(c => c.score <= lowScore + 0);
    if (lowCats.length > 1) return 'High risk';
    return titleMap[worstCat.key] || 'High risk';
  })();

  const verdictMeta = {
    safe:    { icon: '✓', title: 'Looks good',       desc: noSkinWarning ? 'No EU allergens detected. Select a skin type above for a full analysis.' : `No significant concerns detected for your skin type.${_capNote}` },
    caution: { icon: '!', title: 'Use with caution', desc: noSkinWarning ? 'Some EU allergens present — check if you are sensitive to these. Select a skin type for a full analysis.' : `Some ingredients may be problematic — review the details below.${_capNote}` },
    avoid:   { icon: '✕', title: _avoidTitle,        desc: noSkinWarning ? 'Multiple EU allergens found. Select a skin type above for full pore-clogging and irritant analysis.' : `Multiple ingredients are likely problematic for your skin type.${_capNote}` },
  }[verdict];

  // Category rows — bar + plain-text flagged list
  const scoreLabel = (s) => {
    if (s >= 5) return '<span style="font-size:10px;font-weight:400;opacity:0.55;margin-left:5px">No risk</span>';
    if (s === 4) return '<span style="font-size:10px;font-weight:400;opacity:0.55;margin-left:5px">Low risk</span>';
    if (s === 3) return '<span style="font-size:10px;font-weight:400;opacity:0.55;margin-left:5px">Moderate</span>';
    if (s === 2) return '<span style="font-size:10px;font-weight:700;margin-left:5px;color:var(--bad)">High risk</span>';
    return '<span style="font-size:10px;font-weight:700;margin-left:5px;color:var(--bad)">Very high risk</span>';
  };

  const catHTML = cats.map(c => {
    const isCritical = !c.isAllergen && c.score <= 2;
    const isAllergen = !!c.isAllergen;

    // Color class
    const cls = isAllergen ? 'c-allergen'
               : c.score >= 4 ? 'c-safe'
               : c.score === 3 ? 'c-caution'
               : 'c-risk';

    // Bar: for non-allergens, bar = risk level (wider = more risk)
    // For allergens, bar = how many detected (max 5 for visual)
    const pct = isAllergen
      ? Math.min(Math.round((c.flagged.length / 5) * 100), 100)
      : Math.round(((5 - c.score) / 4) * 100);

    // Row class
    const rowClass = isCritical    ? 'cat-row cat-critical'
                   : isAllergen    ? 'cat-row cat-allergen-row'
                   : 'cat-row';

    // Ingredient list — dots + name + reason, all preserved, with show-more at 5
    const SHOW_LIMIT = 5;
    const flagItems = c.flagged.map(f => {
      const dotColor = isAllergen         ? 'rgba(154,122,58,0.65)'
                     : f.severity === 'high' ? 'var(--bad)'
                     : f.severity === 'mid'  ? 'var(--warn)'
                     : 'rgba(26,20,16,0.28)';
      const dot = `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${dotColor};margin-right:5px;flex-shrink:0;position:relative;top:1px"></span>`;
      const reason = f.reason ? `<span style="color:rgba(26,20,16,0.38);font-weight:400"> — ${escHtml(f.reason)}</span>` : '';
      return `<div style="display:flex;align-items:baseline;gap:0;line-height:1.75">${dot}<strong style="font-weight:500">${escHtml(f.name)}</strong>${reason}</div>`;
    });

    let flagHTML = null;
    if (flagItems.length) {
      const catId = 'fl-' + c.key + '-' + Math.random().toString(36).slice(2,6);
      if (flagItems.length <= SHOW_LIMIT) {
        flagHTML = flagItems.join('');
      } else {
        const visible = flagItems.slice(0, SHOW_LIMIT).join('');
        const hidden  = flagItems.slice(SHOW_LIMIT).join('');
        const moreCount = flagItems.length - SHOW_LIMIT;
        flagHTML = `${visible}
          <div id="${catId}-more" style="display:none">${hidden}</div>
          <button onclick="const m=document.getElementById('${catId}-more');const b=this;if(m.style.display==='none'){m.style.display='';b.textContent='Show less ↑';}else{m.style.display='none';b.textContent='Show ${moreCount} more ↓';}"
            style="margin-top:4px;background:none;border:none;color:rgba(26,20,16,0.4);font-size:11px;cursor:pointer;padding:0;font-family:inherit">Show ${moreCount} more ↓</button>`;
      }
    }

    // Allergen note — only when allergens found
    const allergenNote = isAllergen && c.flagged.length > 0
      ? `<div class="cat-allergen-note">Risk is individual — only relevant if you have known fragrance sensitivity.</div>`
      : '';

    // Score display
    const scoreDisplay = isAllergen
      ? (c.flagged.length > 0
          ? `<span class="cat-num c-allergen">${c.flagged.length} detected</span>`
          : `<span class="cat-num c-safe">None</span>`)
      : `<span class="cat-num ${cls}">${c.score}/5${scoreLabel(c.score)}</span>`;

    return `
      <div class="${rowClass}">
        <div class="cat-top">
          <span class="cat-name">${c.name}</span>
          ${scoreDisplay}
        </div>
        <div class="cat-bar-track"><div class="cat-bar-fill ${cls}" style="width:${pct}%"></div></div>
        ${flagHTML
          ? `<div class="cat-flagged" style="margin-top:5px">${flagHTML}</div>`
          : `<div class="cat-ok">${escHtml(c.desc)}</div>`}
        ${allergenNote}
      </div>`;
  }).join('');

  // Unknown ingredients section — links to Google search for each
  const unknownHTML = unknown.length > 0 ? `
    <div class="cat-row" style="margin-top:6px">
      <div class="cat-top">
        <span class="cat-name" style="font-size:12px;color:rgba(26,20,16,0.5)">Additional ingredient review</span>
        <span style="font-size:11px;color:rgba(26,20,16,0.35)">details</span>
      </div>
      <div style="font-size:11px;color:rgba(26,20,16,0.38);margin-bottom:4px;font-style:italic">A few ingredients need further mapping and may affect confidence.</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px">
        ${unknown.map(u => {
          const q = encodeURIComponent(u + ' cosmetic ingredient safety');
          return `<a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener"
            style="font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid rgba(26,20,16,0.15);color:rgba(26,20,16,0.55);text-decoration:none;background:rgba(26,20,16,0.03)">${escHtml(u)}</a>`;
        }).join('')}
      </div>
    </div>` : '';

  const dbCoverage = ingredients.length > 0
    ? Math.round(((ingredients.length - unknown.length) / ingredients.length) * 100)
    : 100;
  trackEvent('result_confidence_shown', {
    confidence: confLabel || 'High',
    dbCoverage,
    unknownCount: unknown.length,
    profileMode
  });

  document.getElementById('results').innerHTML = `
    <div class="r-head">
      ${resultImage ? `<img class="r-head-thumb" src="${escHtml(resultImage)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'r-head-thumb-fallback',textContent:'◈'}))">` : `<div class="r-head-thumb-fallback">◈</div>`}
      <div style="min-width:0;flex:1">
        ${brand ? `<div class="r-brand">${escHtml(brand)}</div>` : ''}
        <div class="r-name">${escHtml(productName)}</div>
        ${resultCategory ? `<div style="font-size:11px;color:rgba(26,20,16,0.4);margin-top:1px">${escHtml(resultCategory)}</div>` : ''}
      </div>
    </div>
    <div class="r-meta">${ingredients.length} ingredients · <span style="color:${confLabel === 'High' ? 'var(--good)' : confLabel === 'Medium' ? 'var(--warn)' : 'var(--bad)'}">Coverage ${dbCoverage}% · Confidence: ${confLabel || 'High'}</span></div>

    <div class="verdict-banner ${verdict}">
      <div class="verdict-left">
        <div class="verdict-icon">${verdictMeta.icon}</div>
        <div>
          <div class="verdict-text-title">${verdictMeta.title}</div>
          <div class="verdict-text-desc">${verdictMeta.desc}</div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        ${noSkinWarning
          ? `<div class="verdict-score" style="font-size:22px;opacity:0.35">—</div>
             <div class="verdict-score-denom">no skin type</div>`
          : `<div class="verdict-score">${overall.toFixed(1)}</div>
             <div class="verdict-score-denom">out of 5</div>
             <div style="font-size:9px;opacity:0.4;margin-top:2px;text-align:right;line-height:1.3">higher = safer</div>`}
      </div>
    </div>

    <div class="r-skin-row">
      <span class="r-skin-label">For:</span>
      ${skinTypes.length ? skinTypes.map(t=>`<span class="r-skin-pill">${skinLabels[t]||t}</span>`).join('') : '<span class="r-skin-pill">General</span>'}
    </div>

    ${noSkinWarning ? `<div style="background:#FDF3E3;border-radius:10px;padding:12px 15px;margin-bottom:14px;font-size:12.5px;color:#9A6500;line-height:1.5">
      <strong>No skin concern selected.</strong> Only EU allergens are being checked.
      Select a skin type above for a full analysis.
    </div>` : ''}
    ${profileMode === 'normal' ? `<div style="background:#F6E9DE;border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:12px;color:#8D471F;line-height:1.5">
      <strong>General profile analysis.</strong> Balanced thresholds are applied for normal skin.
    </div>` : ''}
    ${unknown.length > 0 && (unknown.length / Math.max(ingredients.length, 1)) > 0.2 ? `<div style="background:#FDF3E3;border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:12px;color:#9A6500;line-height:1.5">
      Some ingredients could not be fully analyzed.
    </div>` : ''}
    <div class="cats">${catHTML}${unknownHTML}</div>

    <div class="ai-block">
      <div class="ai-label">Chemist's note</div>
      <div id="aiText"><div class="ai-dots"><span class="ai-dot"></span><span class="ai-dot"></span><span class="ai-dot"></span></div></div>
    </div>

    <div style="display:flex;gap:9px;margin-top:4px">
      <button class="new-scan alt" style="flex:1" onclick="resetScan()">← Scan another</button>
      <button class="new-scan" style="flex:1" onclick="reAnalyze()" title="Re-run with current skin type selection">↺ Re-run with skin settings</button>
    </div>
    <div style="font-size:10.5px;color:rgba(26,20,16,0.25);line-height:1.6;margin-top:14px;text-align:center;padding:0 4px">
      2,200+ ingredient database (K/J/C-beauty expanded). Comedogenicity (Fulton scale). EU allergens per Regulation 1223/2009.
      Unknown ingredients shown above with search links. Not a substitute for dermatological advice.
    </div>
  `;
  document.getElementById('results').classList.add('show');
}

// ── markdownToHtml: lightweight markdown renderer for the Chemist's note ──
// Handles: **bold**, *italic*, line breaks, and **Label:** prefix lines
function markdownToHtml(text) {
  // Escape HTML in the raw text first, then apply markdown transformations
  // We escape char by char so we can selectively allow our own tags
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  return text
    .split('\n')
    .map(line => {
      line = line.trim();
      if (!line) return null;                             // blank lines → skip
      // Apply inline formatting to the line
      line = esc(line)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')   // **bold**
        .replace(/\*([^*]+)\*/g, '<em>$1</em>');               // *italic*
      return `<p style="margin:0 0 6px">${line}</p>`;
    })
    .filter(Boolean)
    .join('');
}

// ── DIAGNOSTIC: shows raw API response on screen (no DevTools needed) ──
async function runDiagnostic() {
  const panel = document.getElementById('diagPanel');
  panel.style.display = 'block';
  panel.textContent = '⏳ Testing connection to ' + apiUrl() + ' ...\n';

  const steps = [];
  const log = (msg) => { steps.push(msg); panel.textContent = steps.join('\n'); };

  // Step 1: basic reachability (no API key needed)
  log('1. Checking Worker reachability...');
  try {
    const r = await fetch(apiUrl().replace('/v1/messages',''), { method: 'GET' });
    log('   HTTP ' + r.status + ' ' + r.statusText);
  } catch(e) { log('   ✗ fetch failed: ' + e.message); }

  // Step 2: minimal Claude call (no web_search, just echo)
  log('\n2. Testing basic Claude call (no web_search)...');
  try {
    const r = await fetch(apiUrl(), {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 30,
        messages: [{ role: 'user', content: 'Reply with the single word: WORKING' }]
      })
    });
    const raw = await r.text();
    log('   HTTP ' + r.status);
    log('   Response: ' + raw.slice(0, 300));
  } catch(e) { log('   ✗ ' + e.message); }

  // Step 3: web_search call
  log('\n3. Testing web_search tool call...');
  try {
    const r = await fetch(apiUrl(), {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 200,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: 'Search for CeraVe moisturizing cream ingredients and reply with just the word FOUND or NOTFOUND.' }]
      })
    });
    const raw = await r.text();
    log('   HTTP ' + r.status);
    log('   Headers sent: ' + JSON.stringify(authHeaders()));
    log('   Response: ' + raw.slice(0, 500));
  } catch(e) { log('   ✗ ' + e.message); }

  log('\n✅ Diagnostic complete.');
}

}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SERVICE WORKER CLEANUP (avoid stale cached shells across deploys)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(regs => Promise.all(regs.map(reg => reg.unregister())))
    .catch(() => {});
}
if ('caches' in window) {
  caches.keys()
    .then(keys => Promise.all(
      keys
        .filter(key => String(key).toLowerCase().includes('skinscan'))
        .map(key => caches.delete(key))
    ))
    .catch(() => {});
}
</script>
</body>
