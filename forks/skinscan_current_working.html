<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8; --dark: #1A1410; --terra: #C4622D;
    --blush: #E8C4A0; --warn: #E8A030; --bad: #C4462A; --good: #4A8C5C;
    --mid: #D4834A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--dark); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* ── HEADER ── */
  header { padding: 20px 20px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid rgba(26,20,16,0.1); }
  /* Logo group: always a vertical stack — title on top, subtitle directly below */
  .logo-group { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .logo-group.clickable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.5px; color: var(--terra); line-height: 1.1; }
  .logo-sub { font-size: 10.5px; font-weight: 400; color: rgba(26,20,16,0.38); letter-spacing: 0.1em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
  .db-tag { font-size: 10px; color: rgba(26,20,16,0.3); background: rgba(26,20,16,0.05); border: 1px solid rgba(26,20,16,0.08); border-radius: 20px; padding: 3px 9px; white-space: nowrap; flex-shrink: 0; }

  main { max-width: 500px; margin: 0 auto; padding: 26px 20px 64px; }

  /* ── SECTION LABEL ── */
  .section-label { font-family: 'Syne', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: rgba(26,20,16,0.35); margin-bottom: 10px; }

  /* ── SKIN CHIPS ── */
  .skin-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 26px; }
  .chip { padding: 7px 15px; border-radius: 50px; border: 1.5px solid rgba(26,20,16,0.18); font-size: 13px; cursor: pointer; background: transparent; color: var(--dark); transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .chip:hover { border-color: var(--terra); color: var(--terra); }
  .chip.active { background: var(--terra); border-color: var(--terra); color: white; }

  /* ── SOURCE TABS ── */
  .source-tabs { display: flex; gap: 5px; margin-bottom: 11px; }
  .source-tab { flex: 1; padding: 8px 8px; border-radius: 9px; border: 1.5px solid rgba(26,20,16,0.13); background: transparent; font-family: 'DM Sans', sans-serif; font-size: 12px; color: rgba(26,20,16,0.4); cursor: pointer; transition: all 0.15s; text-align: center; -webkit-tap-highlight-color: transparent; }
  .source-tab:hover { border-color: var(--terra); color: var(--terra); }
  .source-tab.active { background: var(--terra); border-color: var(--terra); color: white; font-weight: 500; }

  /* ── INPUT ── */
  .input-wrapper { position: relative; margin-bottom: 6px; }

  textarea:focus { border-color: var(--terra); }
  textarea::placeholder { color: rgba(26,20,16,0.28); }
  /* Both icon buttons share the same pill — mic on right, camera left of it */
  .input-icons { position: absolute; right: 9px; top: 9px; display: flex; gap: 5px; }
  .icon-btn { width: 33px; height: 33px; border-radius: 50%; border: none; background: var(--blush); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.15s; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
  .icon-btn:hover { background: var(--terra); transform: scale(1.08); }
  .icon-btn:hover svg * { stroke: white; }
  .icon-btn.recording { background: var(--bad); animation: pulse 1s infinite; }
  .icon-btn.recording svg * { stroke: white; }
  .icon-btn.photo-active { background: var(--terra); }
  .icon-btn.photo-active svg * { stroke: white; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  /* Widen textarea right padding to make room for two icons */
  textarea { width: 100%; min-height: 86px; background: white; border: 1.5px solid rgba(26,20,16,0.13); border-radius: 13px; padding: 13px 84px 13px 15px; font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.6; color: var(--dark); resize: none; outline: none; transition: border-color 0.2s; }

  /* ── SUGGESTIONS ── */
  .suggestions { display: none; background: white; border: 1.5px solid rgba(26,20,16,0.1); border-radius: 11px; overflow: hidden; margin-bottom: 10px; box-shadow: 0 4px 18px rgba(26,20,16,0.07); }
  .suggestions.show { display: block; }
  .sug-item { display: flex; align-items: center; gap: 11px; padding: 10px 13px; cursor: pointer; border-bottom: 1px solid rgba(26,20,16,0.06); transition: background 0.1s; }
  .sug-item:last-child { border-bottom: none; }
  .sug-item:hover { background: rgba(196,98,45,0.04); }
  .sug-thumb { width: 32px; height: 32px; border-radius: 7px; object-fit: contain; background: rgba(26,20,16,0.05); flex-shrink: 0; }
  .sug-thumb-empty { width: 32px; height: 32px; border-radius: 7px; background: rgba(26,20,16,0.05); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .sug-info { flex: 1; min-width: 0; }
  .sug-name { font-size: 13px; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sug-brand { font-size: 11px; color: rgba(26,20,16,0.38); margin-top: 1px; }
  .sug-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 700; letter-spacing: 0.04em; flex-shrink: 0; text-transform: uppercase; }
  .sug-badge.obf  { background: #EBF5EC; color: var(--good); }
  .sug-badge.inci { background: rgba(196,98,45,0.1); color: var(--terra); }
  .sug-status { display: flex; align-items: center; gap: 8px; padding: 12px 13px; font-size: 12.5px; color: rgba(26,20,16,0.55); }
  .sug-status.error { color: var(--bad); }
  .mini-spinner { width: 14px; height: 14px; border: 2px solid rgba(196,98,45,0.2); border-top-color: var(--terra); border-radius: 50%; animation: spin 0.75s linear infinite; flex-shrink: 0; }
  .add-product-panel { display: none; background: white; border: 1.5px dashed rgba(26,20,16,0.22); border-radius: 11px; padding: 12px; margin: 8px 0 12px; }
  .add-product-panel.show { display: block; }
  .add-product-title { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .add-product-desc { font-size: 12px; color: rgba(26,20,16,0.62); margin-bottom: 8px; line-height: 1.45; }
  .add-product-input, .add-product-textarea {
    width: 100%;
    border: 1.5px solid rgba(26,20,16,0.16);
    border-radius: 9px;
    padding: 9px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12.5px;
    color: var(--dark);
    background: #fff;
    margin-bottom: 7px;
    outline: none;
  }
  .add-product-textarea { min-height: 72px; resize: vertical; }
  .add-product-input:focus, .add-product-textarea:focus { border-color: var(--terra); }
  .add-product-actions { display: flex; gap: 8px; }
  .add-product-btn {
    border: 1.5px solid rgba(196,98,45,0.35);
    background: rgba(196,98,45,0.1);
    color: #7A3C1A;
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .add-product-btn.alt {
    background: rgba(26,20,16,0.03);
    border-color: rgba(26,20,16,0.2);
    color: rgba(26,20,16,0.8);
  }
  .add-product-status { font-size: 11.5px; color: rgba(26,20,16,0.62); margin-top: 6px; line-height: 1.4; }

  .hint { font-size: 11.5px; color: rgba(26,20,16,0.35); margin-bottom: 15px; line-height: 1.5; }

  .analyze-btn { width: 100%; padding: 15px; background: var(--dark); color: white; border: none; border-radius: 13px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14.5px; letter-spacing: 0.04em; cursor: pointer; transition: background 0.2s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
  .analyze-btn:hover { background: var(--terra); }
  .analyze-btn:active { transform: scale(0.985); }

  /* ── LOADING ── */
  .loading { display: none; text-align: center; padding: 48px 0; }
  .loading.show { display: block; }
  .spinner { width: 34px; height: 34px; border: 2.5px solid var(--blush); border-top-color: var(--terra); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-main { font-size: 13px; color: rgba(26,20,16,0.4); font-style: italic; }
  .loading-sub  { font-size: 11px; color: rgba(26,20,16,0.25); margin-top: 4px; }

  /* ══════════════════════════════════════
     RESULTS
  ══════════════════════════════════════ */
  .results { display: none; }
  .results.show { display: block; }

  /* ── Product header ── */
  .r-head { display: flex; align-items: center; gap: 11px; margin-bottom: 2px; }
  .r-head-thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; background: rgba(26,20,16,0.05); border: 1px solid rgba(26,20,16,0.08); flex-shrink: 0; }
  .r-head-thumb-fallback { width: 44px; height: 44px; border-radius: 10px; background: rgba(26,20,16,0.05); border: 1px solid rgba(26,20,16,0.08); color: rgba(26,20,16,0.45); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .r-brand { font-size: 11px; color: var(--terra); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 3px; }
  .r-name  { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.15; margin-bottom: 2px; }
  .r-meta  { font-size: 11.5px; color: rgba(26,20,16,0.35); margin-bottom: 20px; }

  /* ── Verdict banner — one tinted strip, nothing else ── */
  .verdict-banner { border-radius: 12px; padding: 16px 18px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .verdict-banner.safe    { background: #E8F3E9; }
  .verdict-banner.caution { background: #FDF3E3; }
  .verdict-banner.avoid   { background: #FAEAE7; }
  .verdict-left { display: flex; align-items: center; gap: 11px; }
  .verdict-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; font-weight: 700; }
  .safe    .verdict-icon { background: var(--good);   color: white; }
  .caution .verdict-icon { background: var(--warn);   color: white; }
  .avoid   .verdict-icon { background: var(--bad);    color: white; }
  .verdict-text-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
  .safe    .verdict-text-title { color: var(--good); }
  .caution .verdict-text-title { color: #B07000; }
  .avoid   .verdict-text-title { color: var(--bad);  }
  .verdict-text-desc { font-size: 12px; color: rgba(26,20,16,0.5); margin-top: 1px; }
  .verdict-score { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
  .verdict-score-denom { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 400; color: rgba(26,20,16,0.3); }
  .safe    .verdict-score { color: var(--good); }
  .caution .verdict-score { color: var(--warn); }
  .avoid   .verdict-score { color: var(--bad);  }

  /* Skin context — very quiet, below verdict */
  .r-skin-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 22px; margin-top: 8px; }
  .r-skin-label { font-size: 11px; color: rgba(26,20,16,0.3); align-self: center; }
  .r-skin-pill  { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(196,98,45,0.07); color: rgba(196,98,45,0.8); border: 1px solid rgba(196,98,45,0.15); }

  /* ── Category rows — single white card, separated by hairlines ── */
  .cats { background: white; border-radius: 13px; margin-bottom: 18px; overflow: hidden; }
  .cat-row { padding: 13px 16px; border-bottom: 1px solid rgba(26,20,16,0.06); }
  .cat-row:last-child { border-bottom: none; }

  /* Top line: name left, score-num right */
  .cat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .cat-name { font-size: 13px; font-weight: 500; color: var(--dark); }
  .cat-num  { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; }
  .cat-num.c-safe    { color: var(--good); }
  .cat-num.c-caution { color: var(--warn); }
  .cat-num.c-risk    { color: var(--bad);  }
  .cat-num.c-allergen { color: #9A7A3A; }

  /* Bar — this IS the score, full width, no dots */
  .cat-bar-track { height: 4px; background: rgba(26,20,16,0.07); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
  .cat-bar-fill  { height: 100%; border-radius: 2px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .cat-bar-fill.c-safe    { background: var(--good); }
  .cat-bar-fill.c-caution { background: var(--warn); }
  .cat-bar-fill.c-risk    { background: var(--bad);  }
  .cat-bar-fill.c-allergen { background: #C4A040; }

  /* Flagged ingredients — plain list, no colored pills */
  .cat-flagged { font-size: 12px; color: rgba(26,20,16,0.5); line-height: 1.6; }
  .cat-flagged strong { color: var(--dark); font-weight: 500; }
  .cat-ok { font-size: 12px; color: rgba(26,20,16,0.35); font-style: italic; }

  /* Critical risk row (score 1-2) — red left accent + faint tint */
  .cat-row.cat-critical {
    background: rgba(196,70,42,0.04);
    border-left: 3px solid var(--bad);
    padding-left: 13px;
  }
  /* Allergen row — always neutral amber, never red */
  .cat-row.cat-allergen-row {
    background: rgba(232,160,48,0.05);
    border-left: 3px solid rgba(232,160,48,0.4);
    padding-left: 13px;
  }
  .cat-allergen-note {
    font-size: 11px;
    color: rgba(154,122,58,0.8);
    margin-top: 4px;
    font-style: italic;
  }

  /* ── AI block — minimal, no border-top accent ── */
  .ai-block { background: white; border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; }

  .ai-label { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: rgba(26,20,16,0.35); margin-bottom: 9px; }
  .ai-text  { font-size: 13px; color: rgba(26,20,16,0.62); line-height: 1.7; }
  .ai-dots  { display: flex; align-items: center; gap: 5px; }
  .ai-dot   { width: 4px; height: 4px; border-radius: 50%; background: var(--terra); animation: blink 1.1s infinite; }
  .ai-dot:nth-child(2) { animation-delay: 0.18s; }
  .ai-dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }

  /* ── Not found ── */
  .not-found { background: #FDF3E3; border-radius: 12px; padding: 18px 18px; margin-bottom: 18px; }
  .not-found-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; color: #9A6500; margin-bottom: 5px; }
  .not-found-desc  { font-size: 13px; color: rgba(26,20,16,0.55); line-height: 1.55; }

  /* ── Reset button ── */
  .new-scan { width: 100%; padding: 13px; background: rgba(196,98,45,0.08); color: #8D471F; border: 1.5px solid rgba(196,98,45,0.35); border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.18s; }
  .new-scan:hover { background: rgba(196,98,45,0.14); border-color: rgba(196,98,45,0.5); color: #7A3C1A; }
  .new-scan:focus-visible { outline: 2px solid rgba(196,98,45,0.55); outline-offset: 2px; }
  .new-scan.alt { background: rgba(26,20,16,0.04); color: rgba(26,20,16,0.78); border-color: rgba(26,20,16,0.22); }
  .new-scan.alt:hover { background: rgba(26,20,16,0.08); border-color: rgba(26,20,16,0.32); color: rgba(26,20,16,0.9); }
  .attribution { text-align: center; font-size: 11px; color: rgba(26,20,16,0.22); margin-top: 28px; }
  .attribution a { color: rgba(26,20,16,0.3); text-decoration: none; }
  .attribution a:hover { color: var(--terra); }


  /* ── Mobile / touch refinements ── */
  @media (max-width: 500px) {
    main { padding: 20px 16px 80px; }
    header { padding: 18px 16px 14px; }
    .analyze-btn { padding: 17px; font-size: 15px; }
    /* Bigger tap targets on mobile */
    .icon-btn { width: 38px; height: 38px; }
    textarea { padding: 13px 94px 13px 14px; font-size: 15px; }
    .chip { padding: 8px 16px; font-size: 13.5px; }
  }
  /* Prevent iOS bounce / overscroll on the app shell */
  html { height: 100%; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
  /* Remove blue tap highlight globally on mobile */
  * { -webkit-tap-highlight-color: transparent; }
</style>

<header>

    <span class="logo">SkinScan</span>

  </div>
</header>

<main>
  <div class="section-label">My skin is</div>
  <div class="skin-chips" id="skinChips">
    <button class="chip" data-type="acne-prone">Acne-prone</button>
    <button class="chip" data-type="sensitive">Sensitive / Reactive</button>
    <button class="chip" data-type="dry">Dry</button>

  <div style="margin:-16px 0 12px;display:flex;justify-content:flex-end">

  </div>
  <div id="skinHint" style="font-size:11px;color:rgba(196,98,45,0.65);margin:-4px 0 6px 2px;display:none">
    ↑ Select at least one skin type for a full analysis
  </div>

  <div id="inputSection">
    <div class="section-label">What product?</div>
    <div class="source-tabs" style="display:none" aria-hidden="true"></div>
    <div class="input-wrapper">
      <textarea id="productInput" placeholder="Type a product name, or paste the ingredient list…" rows="3"></textarea>
      <div class="input-icons">
        <!-- Camera: opens device camera or file picker -->
        <button class="icon-btn" id="photoBtn" title="Scan ingredient label" onclick="document.getElementById('cameraInput').click()">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M5.5 2L4.5 3.5H2C1.45 3.5 1 3.95 1 4.5V12.5C1 13.05 1.45 13.5 2 13.5H14C14.55 13.5 15 13.05 15 12.5V4.5C15 3.95 14.55 3.5 14 3.5H11.5L10.5 2H5.5Z" stroke="#C4622D" stroke-width="1.3" stroke-linejoin="round"/>

        <button class="icon-btn" id="micBtn" title="Dictate product name">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <rect x="4.5" y="0.75" width="6" height="8" rx="3" stroke="#C4622D" stroke-width="1.3"/>

      </div>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoUpload(event)">

    <div style="margin-top:14px;text-align:center">

    </div>

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const micBtn = document.getElementById('micBtn');
let recognition = null, isRecording = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ── iOS Safari notes ──────────────────────────────────────────────
  // • interimResults:true causes iOS to never fire isFinal=true — keep false
  // • iOS auto-stops after ~6s silence; onend fires before onresult sometimes
  // • We track the best transcript ourselves and commit it in onend
  // ─────────────────────────────────────────────────────────────────
  let pendingTranscript = '';   // best transcript seen so far this session

  function buildRecognition() {
    const r = new SR();
    r.continuous      = false;
    r.interimResults  = false;  // iOS: true breaks final delivery
    r.lang            = 'en-US';
    r.maxAlternatives = 1;

    r.onstart = () => {
      pendingTranscript = '';
      productInput.placeholder = 'Listening…';
    };

    r.onresult = e => {
      // Collect ALL results (not just from resultIndex) so nothing is missed
      let transcript = '';
      for (let i = 0; i < e.results.length; i++) {
        transcript += e.results[i][0].transcript;
      }
      pendingTranscript = transcript.trim();
      productInput.value = pendingTranscript;
    };

    r.onspeechend = () => {
      // Speech finished — stop cleanly (iOS sometimes needs this nudge)
      try { r.stop(); } catch (_) {}
    };

    r.onend = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
      productInput.placeholder = 'Type a product name, or paste the ingredient list…';

      // Commit whatever transcript we have (covers iOS where onresult fires late or not at all)
      if (pendingTranscript) {
        productInput.value = pendingTranscript;
        triggerSuggest(pendingTranscript);
      }
      // Rebuild for next use (iOS reuses of the same instance are unreliable)
      recognition = buildRecognition();
    };

    r.onerror = e => {
      isRecording = false;
      micBtn.classList.remove('recording');
      productInput.placeholder = 'Type a product name, or paste the ingredient list…';
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        console.warn('Speech recognition error:', e.error);
      }
      recognition = buildRecognition();
    };

    return r;
  }

  recognition = buildRecognition();

  micBtn.addEventListener('click', () => {
    if (isRecording) {
      try { recognition.stop(); } catch (_) {}
    } else {
      isRecording = true;
      micBtn.classList.add('recording');
      try { recognition.start(); }
      catch (err) {
        // Already started or not allowed — reset
        isRecording = false;
        micBtn.classList.remove('recording');
        recognition = buildRecognition();
      }
    }
  });

} else {
  micBtn.style.opacity = '0.3';
  micBtn.title = 'Speech recognition not supported on this browser';
}

// PHOTO / CAMERA MODE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  // Resize + convert to JPEG via canvas (handles HEIC, PNG, WebP, large photos)
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (e) => {
    img.onload = () => {
      // Resize to max 1400px on longest side (enough for text OCR, small enough for API)
      const MAX = 1400;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else       { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // Export as JPEG (works universally, ~80% quality keeps text sharp)
      const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.82);
      capturedPhotoBase64 = jpegDataUrl.split(',')[1];

      // Show preview
      document.getElementById('photoImg').src = jpegDataUrl;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoBtn').classList.add('photo-active');
      productInput.value = '';
      selectedProduct = null;
      hideSuggestions();
      // gap #8: dim source tabs when photo staged
      document.querySelector('.source-tabs').style.opacity = '0.35';
      document.querySelector('.source-tabs').style.pointerEvents = 'none';
    };
    img.onerror = () => {
      // Fallback: send raw if canvas fails (shouldn't happen)
      const dataUrl = e.target.result;
      capturedPhotoBase64 = dataUrl.split(',')[1];
      document.getElementById('photoImg').src = dataUrl;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoBtn').classList.add('photo-active');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}
function clearPhoto() {
  capturedPhotoBase64 = null;
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('photoImg').src = '';
  document.getElementById('photoBtn').classList.remove('photo-active');
  // gap #8: restore source tabs
  document.querySelector('.source-tabs').style.opacity = '';
  document.querySelector('.source-tabs').style.pointerEvents = '';
}

// ── analyzePhoto: send image to Claude Vision, extract ingredients ──
// Images are pre-processed to JPEG by handlePhotoUpload (resize + compress)
async function analyzePhoto(base64Image) {
  async function visionCall(prompt) {
    const res = await fetch(apiUrl(), {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1500,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64Image } },
          { type: 'text', text: prompt }
        ]}]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  }

  try {
    const prompt1 = 'Look at this photo of a cosmetic product. Find the ingredient list (small text on the back/side, starting with "Ingredients:" or "INGREDIENTS:"). Read every ingredient name separated by commas. Reply with ONLY these three lines — no extra text:\nPRODUCT: [product name or Unknown Product]\nBRAND: [brand or blank]\nINGREDIENTS: [full comma-separated ingredient list]\nIf no ingredient list is visible, reply: NOT_FOUND';

    const text1 = await visionCall(prompt1);

    if (!text1.includes('NOT_FOUND') && text1.includes('INGREDIENTS:')) {
      const pm = text1.match(/PRODUCT:\s*(.+)/i);
      const bm = text1.match(/BRAND:\s*(.+)/i);
      const im = text1.match(/INGREDIENTS:\s*([\s\S]+)/i);
      if (im && im[1].trim().length > 10) {
        return { productName: pm ? pm[1].trim() : 'Unknown Product', brand: bm ? bm[1].trim() : '', ingredients: im[1].trim().split('\n')[0] };
      }
    }

    // Retry with a broader prompt
    const prompt2 = 'This is a cosmetic product packaging photo. Please read ALL visible text and find any ingredient names (chemical/botanical names separated by commas). Start your reply with "INGREDIENTS:" then list them comma-separated on one line. If you see a product name, add PRODUCT: [name] on the next line.';
    const text2 = await visionCall(prompt2);

    const pm2 = text2.match(/PRODUCT:\s*(.+)/i);
    const bm2 = text2.match(/BRAND:\s*(.+)/i);
    const im2 = text2.match(/INGREDIENTS:\s*([\s\S]+)/i);
    if (im2 && im2[1].trim().length > 10) {
      return { productName: pm2 ? pm2[1].trim() : 'Unknown Product', brand: bm2 ? bm2[1].trim() : '', ingredients: im2[1].trim().split('\n')[0] };
    }

    return { error: "Couldn't read the ingredient list clearly. Try a closer shot with the label flat, good lighting, and text in focus." };
  } catch(e) {
    console.error('analyzePhoto error:', e);
    return { error: 'Connection error. Check your internet and try again.' };
  }
}

function addProductStatusCopy(state, failureCode = '') {
  if (state === 'add_submitting') return 'Submitting…';
  if (state === 'add_queued') return 'Submitted. Waiting in queue…';
  if (state === 'add_processing') return 'Indexing in progress…';
  if (state === 'add_completed') return 'Indexed. Refreshing suggestions…';
  if (state === 'add_failed') {
    const map = {
      invalid_url: 'Invalid URL. Use a full http/https product page URL.',
      blocked_host: 'This URL host is blocked for safety. Try a public product page.',
      fetch_timeout: 'Fetching timed out. Try another product URL.',
      parser_no_product: 'Could not parse a product from that page yet.',
      parser_no_brand: 'Product page found, but brand was missing.',
      parser_no_name: 'Product page found, but product name was missing.',
      low_similarity: 'That page did not match your query closely enough.',
      upsert_failed: 'Could not save this product right now. Try again.'
    };
    return map[failureCode] || 'Indexing failed for now. You can still paste ingredients and analyze.';
  }
  return '';
}

function updateAddProductUi(state, options = {}) {

async function resolveIngestedProduct(query, productId) {
  if (!query || !productId) return null;
  const resolution = await resolveProductFromBackend(query);
  if (!resolution) return null;
  if (resolution.product?.productId === productId) return resolution.product;
  if (Array.isArray(resolution.candidates)) {
    const hit = resolution.candidates.find(c => c?.productId === productId);
    if (hit) return hit;
  }
  return null;
}

async function autoAnalyzeIngestedProduct({ query, productId, submittedIngredients = '' }) {
  let resolvedProduct = await resolveIngestedProduct(query, productId);
  let ingredientsText = String(resolvedProduct?.ingredientsText || '').trim();
  let analysisSource = 'resolver';

  if (!ingredientsText && productId) {
    try {
      const res = await fetch(resolverUrl(`/resolver/products/${encodeURIComponent(productId)}/ingredients-status`));
      if (res.ok) {
        const status = await res.json();
        ingredientsText = String(status.ingredientsText || '').trim();
      }
    } catch (_) {}
  }

  if (!ingredientsText && submittedIngredients.trim()) {
    ingredientsText = submittedIngredients.trim();
    analysisSource = 'user_submitted_manual';
  }
  if (!ingredientsText) return false;

  hideSuggestions();
  hideAddProductCapture();
  document.getElementById('inputSection').style.display = 'none';
  document.getElementById('loading').classList.add('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';
  setLoading('Analyzing ingredients…', 'Using submitted product data');

  await runAnalysis(
    resolvedProduct?.name || query || 'Custom Product',
    resolvedProduct?.brand || '',
    ingredientsText,
    analysisSource,
    resolvedProduct?.img || '',
    resolvedProduct?.category || ''
  );
  return true;
}

async function pollIngestionJob(jobId, query, submittedIngredients = '') {
  const token = ++addProductPollToken;
  const startedAt = Date.now();
  while (Date.now() - startedAt <= 18000) {
    await new Promise(resolve => setTimeout(resolve, 2000));
    if (token !== addProductPollToken) return null;
    try {
      const res = await fetch(resolverUrl(`/resolver/ingestion-status/${encodeURIComponent(jobId)}`));
      if (!res.ok) continue;
      const data = await res.json();
      if (data.state === 'queued') updateAddProductUi('add_queued');
      if (data.state === 'processing') updateAddProductUi('add_processing');
      if (data.state === 'completed') {
        updateAddProductUi('add_completed');
        const autoAnalyzed = await autoAnalyzeIngestedProduct({
          query,
          productId: data.productId || '',
          submittedIngredients
        });
        if (!autoAnalyzed && query) triggerSuggest(query);
        trackEvent('add_product_ingestion_completed', { ingestionJobId: jobId, productId: data.productId || '' });
        return data;
      }
      if (data.state === 'failed') {
        updateAddProductUi('add_failed', { failureCode: data.failureCode || '' });
        trackEvent('add_product_ingestion_failed', { ingestionJobId: jobId, reason: data.reason || '', failureCode: data.failureCode || '' });
        return data;
      }
    } catch (_) {}
  }
  updateAddProductUi('add_failed', { failureCode: 'fetch_timeout' });
  return null;
}

async function submitAddProduct() {
  if (!lastAddProductMeta) return;
  const urlEl = document.getElementById('addProductUrl');
  const ingredientsEl = document.getElementById('addProductIngredients');
  const productUrl = (urlEl?.value || '').trim();
  const ingredientsText = (ingredientsEl?.value || '').trim();
  if (!productUrl && !ingredientsText) {
    updateAddProductUi('add_failed', { text: 'Add a product URL or paste ingredients.' });
    return;
  }
  updateAddProductUi('add_submitting');
  try {
    const res = await fetch(resolverUrl('/resolver/feedback/add-product'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: lastAddProductMeta.query,
        productUrl,
        ingredientsText,
        locale: lastAddProductMeta.locale,
        region: lastAddProductMeta.region
      })
    });
    const data = res.ok ? await res.json() : {};
    if (!res.ok || !data.accepted || !data.ingestionJobId) {
      updateAddProductUi('add_failed', { text: 'Could not submit right now. Try again in a moment.' });
      trackEvent('add_product_submission_failed', { query: lastAddProductMeta.query });
      return;
    }
    updateAddProductUi('add_queued', {
      text: data.estimatedWaitMs
        ? `Submitted. Estimated wait ~${Math.max(1, Math.round(Number(data.estimatedWaitMs) / 1000))}s.`
        : ''
    });
    trackEvent('add_product_submission_sent', { query: lastAddProductMeta.query, ingestionJobId: data.ingestionJobId });
    pollIngestionJob(data.ingestionJobId, lastAddProductMeta.query, ingredientsText);
  } catch (_) {
    updateAddProductUi('add_failed', { text: 'Could not submit right now. Try again in a moment.' });
  }
}
async function searchOBF(query) {
  const url = `https://world.openbeautyfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=8&fields=product_name,brands,ingredients_text,image_small_url,categories`;
  const res = await fetch(url, { headers: { 'User-Agent': 'SkinScan/1.0 (skinscan@example.com)' } });
  if (!res.ok) throw new Error('obf_search_failed');
  const data = await res.json();
  return (data.products || [])
    .filter(p => p.product_name)
    .map(p => ({
      name: p.product_name,
      brand: p.brands || '',
      ingredientsText: p.ingredients_text || '',
      ingredientsStatus: p.ingredients_text?.length > 20 ? 'available' : 'missing',
      img: p.image_small_url || '',
      category: (p.categories || '').split(',')[0]?.trim() || '',
      source: 'obf'
    }));
}

// ── searchINCIBySnippet ──
// Does ONE web_search call with tool_choice:any so it reliably fires.
// Reads the raw search result content blocks (tool_result) — which contain
// full ingredient lists in their snippets — instead of asking Claude to
// generate formatted output. Much more reliable.
async function searchINCIBySnippet(query) {
  const cached = cacheGet('inci', query);
  if (cached) return cached;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);
  try {
    const res = await fetch(apiUrl(), {
      method: 'POST', headers: authHeaders(), signal: controller.signal,
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 2000,
        tools: [{ type: 'web_search_20250305', name: 'web_search', allowed_domains: ['incidecoder.com'] }],
        messages: [{ role: 'user', content:
          'Find "' + query.replace(/"/g, '') + '" on incidecoder.com and return its full ingredient list.' +
          '\nRespond with exactly:\nPRODUCT: <full name>\nBRAND: <brand>\nINGREDIENTS: <comma-separated INCI list>'
        }],
      }),
    });
    clearTimeout(timer);
    const data = await res.json();
    if (data.error) { console.error('[inci] error:', data.error); return null; }
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    console.log('[inci] response:', text.slice(0, 200));
    return parseSearchResult(text, query);
  } catch(e) {
    clearTimeout(timer);
    console.error('[inci] exception:', e.message);
    return null;
  }
}

function parseSearchResult(text, fallbackQuery) {
  const productMatch     = text.match(/PRODUCT:\s*(.+)/i);
  const brandMatch       = text.match(/BRAND:\s*(.+)/i);
  const ingredientsMatch = text.match(/INGREDIENTS:\s*([\s\S]+)/i);
  let ingredients = ingredientsMatch ? ingredientsMatch[1].trim().split('\n')[0] : '';
  if (!ingredients || ingredients.length < 20) {
    // Fallback parse for prose snippets containing ingredient blocks.
    const loose = text.match(/ingredients?\s*[:\-]?\s*([A-Za-z0-9\-\(\)\/,\.\s]{80,2500})/i);
    if (loose && loose[1]) ingredients = loose[1].trim().split('\n')[0];
  }
  if (!ingredients || ingredients.length < 20) return null;
  const result = {
    productName: productMatch ? productMatch[1].trim() : fallbackQuery,
    brand:       brandMatch   ? brandMatch[1].trim()   : '',
    ingredients,
  };
  cacheSet('inci', fallbackQuery, result);
  return result;
}

async function searchINCI(query) {

    return [{ name, brand:'', ingredientsText:'', ingredientsStatus: 'missing', img:'', category:'', source:'inci', slug: cachedSlug }];
  }

  const timer = setTimeout(() => controller.abort(), 20000);

      body: JSON.stringify({

function parseSlugList(text) {
  const clean = text.replace(/```json|```/gi, '').trim();
  const match = clean.match(/\[[\s\S]*\]/);
  if (!match) return [];
  try {
    return JSON.parse(match[0])
      .filter(p => p.slug)
      .map(p => ({ name: p.name||p.slug, brand: p.brand||'', ingredientsText:'', ingredientsStatus: 'missing', img:'', category:'', source:'inci', slug: p.slug }));
  } catch(e) { return []; }
}

// For a known slug: one search call, read ingredients from snippet.

async function fetchInciIngredients(slugOrQuery, isQuery = false) {

  if (isQuery) {

const FUZZY_QUERY_MAP = {
  'esta louder': 'estee lauder',
  'estee louder': 'estee lauder',
  'laroche posay': 'la roche posay',
  'loroche posay': 'la roche posay',
};

function normalizeQuery(q) {
  return (q || '').toLowerCase().replace(/[^\w\s-]/g, ' ').replace(/\s+/g, ' ').trim();
}
function applyFuzzyCorrection(normalizedQuery) {
  let corrected = normalizedQuery;
  Object.entries(FUZZY_QUERY_MAP).forEach(([wrong, right]) => {
    if (corrected.includes(wrong)) corrected = corrected.replace(wrong, right);
  });
  return corrected;
}
function wordOverlapScore(query, text) {
  const qWords = query.split(/\s+/).filter(Boolean);
  if (!qWords.length) return 0;
  const target = (text || '').toLowerCase();
  const hits = qWords.filter(w => target.includes(w)).length;
  return hits / qWords.length;
}
function computeCandidateScore(candidate, normalizedQuery, usedFuzzy) {
  const nameScore = wordOverlapScore(normalizedQuery, candidate.name || '');
  const brandScore = wordOverlapScore(normalizedQuery, candidate.brand || '');
  const ingredientBoost = candidate.ingredientsStatus === 'available' ? 0.08 : 0;
  const imageBoost = candidate.img ? 0.05 : 0;
  const exactBoost = (candidate.name || '').toLowerCase() === normalizedQuery ? 0.2 : 0;
  const fuzzyPenalty = usedFuzzy ? -0.08 : 0;
  const confidenceScore = Math.max(0, Math.min(1, (nameScore * 0.72) + (brandScore * 0.2) + ingredientBoost + imageBoost + exactBoost + fuzzyPenalty));
  return {
    confidenceScore,
    nameSimilarity: Number(nameScore.toFixed(3)),
    brandSimilarity: Number(brandScore.toFixed(3))
  };
}
function rankCandidates(candidates, normalizedQuery, usedFuzzy) {
  return [...candidates]
    .map(c => ({ ...c, ...computeCandidateScore(c, normalizedQuery, usedFuzzy), brandMatched: null }))
    .sort((a, b) => b.confidenceScore - a.confidenceScore);
}
function classifyResolution(ranked) {
  if (!ranked.length) return { state: 'not_found', decisionReason: 'ambiguous', autoResolved: false };
  const top = ranked[0];
  const second = ranked[1];
  const gap = second ? (top.confidenceScore - second.confidenceScore) : 1;
  const highExact = top.confidenceScore >= 0.9 && gap >= 0.2 && top.ingredientsStatus === 'available' && top.nameSimilarity >= 0.85;
  let confidence = 'low';
  let state = 'candidate_list';
  let decisionReason = 'ambiguous';
  let autoResolved = false;
  if (highExact) {
    confidence = 'high';
    state = 'resolved_high';
    decisionReason = 'exact_high';
    autoResolved = true;
  } else if (top.confidenceScore >= 0.62 && gap >= 0.12) {
    confidence = 'medium';
    state = 'resolved_medium';
    decisionReason = gap < 0.15 ? 'low_gap' : 'ambiguous';
  } else if (gap < 0.12) {
    decisionReason = 'low_gap';
  }
  top.confidence = confidence;
  top.needsConfirmation = confidence !== 'high';
  top.scoreGap = Number(gap.toFixed(3));
  trackEvent('search_confidence_assigned', {
    confidence,
    topScore: Number(top.confidenceScore.toFixed(2)),
    candidateCount: ranked.length,
    decisionReason,
    autoResolved
  });
  if (state === 'candidate_list') {
    return {
      state,
      decisionReason,
      autoResolved: false,
      candidates: ranked.slice(0, 7).map((c, idx) => ({ ...c, confidence: idx === 0 ? 'medium' : 'low', needsConfirmation: true, scoreGap: Number((top.confidenceScore - c.confidenceScore).toFixed(3)) }))
    };
  }
  return { state, product: top, decisionReason, autoResolved };
}
async function searchWebCandidates(query) {
  const cached = cacheGet('webcand', query);
  if (cached) return cached;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 22000);
  try {
    const res = await fetch(apiUrl(), {
      method: 'POST',
      headers: authHeaders(),
      signal: controller.signal,
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{
          role: 'user',
          content: 'Find up to 5 likely cosmetic product matches for: ' + query.replace(/"/g, '') +
            '\nRespond as raw JSON array only:' +
            '\n[{"name":"...","brand":"...","category":"...","imageUrl":"...","ingredientsAvailable":true}]'
        }]
      })
    });
    clearTimeout(timer);
    const data = await res.json();
    if (!res.ok || data.error) return [];
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    const match = text.replace(/```json|```/gi, '').match(/\[[\s\S]*\]/);
    if (!match) return [];
    const parsed = JSON.parse(match[0]);
    const out = (parsed || []).map(p => ({
      name: p.name || '',
      brand: p.brand || '',
      category: p.category || '',
      img: p.imageUrl || '',
      ingredientsText: '',
      ingredientsStatus: p.ingredientsAvailable ? 'available' : 'missing',
      source: 'web'
    })).filter(p => p.name);
    cacheSet('webcand', query, out);
    return out;
  } catch (_) {
    clearTimeout(timer);
    return [];
  }
}
function dedupeCandidates(candidates) {
  const seen = new Set();
  return candidates.filter(c => {
    const k = normalizeQuery((c.brand || '') + ' ' + (c.name || ''));
    if (!k || seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
function cleanCandidateText(v, max = 180) {
  return String(v || '')
    .replace(/\s+/g, ' ')
    .replace(/\((open beauty facts|incidecoder|source:[^)]+)\)/ig, '')
    .replace(/\s+\|\s+(official|reviews?|shop|store).*$/ig, '')
    .trim()
    .slice(0, max);
}
function mapBackendProduct(p) {
  if (!p) return null;
  const rawBrand = cleanCandidateText(p.brand || '', 80);
  let rawName = cleanCandidateText(p.name || '', 180);
  if (rawBrand && rawName.toLowerCase().startsWith(rawBrand.toLowerCase() + ' ')) {
    rawName = rawName.slice(rawBrand.length).trim();
  }
  return {
    productId: p.productId || '',
    name: rawName,
    brand: rawBrand,
    category: cleanCandidateText(p.category || p.line || '', 100),
    img: p.imageUrl || '',
    ingredientsText: p.ingredientsText || '',
    ingredientsStatus: p.ingredientsStatus || (p.ingredientsText ? 'available' : 'missing'),
    ingredientResolutionState: p.ingredientResolutionState || (p.ingredientsText ? 'available' : 'unavailable_retryable'),
    ingredientJobId: p.ingredientJobId || p.productId || '',
    ingredientFailureStage: p.ingredientFailureStage || '',
    confidence: p.confidence || 'low',
    needsConfirmation: !!p.needsConfirmation,
    brandMatched: typeof p.brandMatched === 'boolean' ? p.brandMatched : null,
    nameSimilarity: Number(p.nameSimilarity || 0),
    brandSimilarity: Number(p.brandSimilarity || 0),
    scoreGap: Number(p.scoreGap || 0),
    source: 'backend-index'
  };
}
async function resolveProductLocal(query, options = {}) {
  const normalizedQuery = normalizeQuery(query);
  const correctedQuery = applyFuzzyCorrection(normalizedQuery);
  const usedFuzzy = correctedQuery !== normalizedQuery;
  const lookups = await Promise.allSettled([searchOBF(correctedQuery), searchINCI(correctedQuery)]);
  let candidates = [];
  let hadAnySuccess = false;
  lookups.forEach(r => {
    if (r.status === 'fulfilled') {
      hadAnySuccess = true;
      candidates.push(...(r.value || []));
    }
  });
  candidates = dedupeCandidates(candidates);
  let ranked = rankCandidates(candidates, correctedQuery, usedFuzzy);
  let classified = classifyResolution(ranked);
  if ((classified.state === 'not_found' || classified.state === 'candidate_list') && options.includeWebFallback) {
    const webCandidates = await searchWebCandidates(correctedQuery);
    candidates = dedupeCandidates([...candidates, ...webCandidates]);
    ranked = rankCandidates(candidates, correctedQuery, usedFuzzy);
    classified = classifyResolution(ranked);
  }
  if (classified.state === 'not_found' && !hadAnySuccess) return { state: 'error', normalizedQuery: correctedQuery, appliedFuzzyCorrection: usedFuzzy };
  return { ...classified, normalizedQuery: correctedQuery, appliedFuzzyCorrection: usedFuzzy };
}
async function resolveProductFromBackend(query, options = {}) {
  try {
    const locale = (navigator.language || 'en-US');
    const region = (locale.split('-')[1] || '').toUpperCase();
    const endpoint = options.fast ? '/resolver/products/fast' : '/resolver/products';
    const timeoutMs = Number(options.timeoutMs || (options.fast ? 1800 : 12000));
    const controller = options.abortController || new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    let res;
    try {
      res = await fetch(resolverUrl(endpoint), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, locale, region }),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timer);
    }
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || !data.state) return null;
    const mapped = {
      state: data.state,
      normalizedQuery: data.normalized_query || normalizeQuery(query),
      appliedFuzzyCorrection: Array.isArray(data.applied_corrections) && data.applied_corrections.length > 0,
      decisionReason: data.decisionReason || '',
      autoResolved: !!data.autoResolved,
      ingredientResolutionState: data.ingredientResolutionState || '',
      ingredientJobId: data.ingredientJobId || '',
      ingredientFailureStage: data.ingredientFailureStage || '',
      latencyMs: Number(data.latencyMs || 0)
    };
    if (data.product) mapped.product = mapBackendProduct(data.product);
    if (Array.isArray(data.candidates)) mapped.candidates = data.candidates.map(mapBackendProduct).filter(Boolean);
    return mapped;
  } catch (_) {
    return null;
  }
}

async function resolveProduct(query, options = {}) {
  const backend = await resolveProductFromBackend(query, {
    fast: !!options.forSuggest,
    timeoutMs: options.forSuggest ? 1800 : 12000,
    abortController: options.abortController || null
  });
  if (backend && backend.state && backend.state !== 'error') return backend;
  if (options.forSuggest) {
    return {
      state: 'candidate_list',
      decisionReason: 'unknown_brand',
      autoResolved: false,
      normalizedQuery: normalizeQuery(query),
      candidates: []
    };
  }
  return {
    state: 'error',
    decisionReason: 'backend_unavailable',
    autoResolved: false,
    normalizedQuery: normalizeQuery(query),
    candidates: []
  };
}

async function triggerSuggest(query) {
  if (activeSuggestAbortController) {
    try { activeSuggestAbortController.abort(); } catch (_) {}
  }
  activeSuggestAbortController = new AbortController();
  const requestId = ++latestSuggestRequestId;
  setSearchState('searching', { query });
  const resolution = await resolveProduct(query, {
    includeWebFallback: false,
    forSuggest: true,
    abortController: activeSuggestAbortController
  });
  if (requestId !== latestSuggestRequestId || productInput.value.trim() !== query.trim()) return;
  if (resolution.state === 'error') {
    setSearchState('error', { query });
    return;
  }
  if (resolution.state === 'resolved_high') {
    if (resolution.autoResolved === false && resolution.product) {
      showSuggestions([resolution.product], {
        confirmMode: true,
        meta: { query, normalizedQuery: resolution.normalizedQuery || normalizeQuery(query), selectionContext: 'suggestions' }
      });
      setSearchState('results', { query });
      trackEvent('product_confirmation_shown', { query, confidence: 'high_guarded', decisionReason: resolution.decisionReason || 'guarded_high' });
      return;
    }
    setSearchState('idle', { query });
    return;
  }
  if (resolution.state === 'resolved_medium') {
    showSuggestions([resolution.product], {
      confirmMode: true,
      meta: { query, normalizedQuery: resolution.normalizedQuery || normalizeQuery(query), selectionContext: 'suggestions' }
    });
    setSearchState('results', { query });
    trackEvent('product_confirmation_shown', { query, confidence: 'medium', decisionReason: resolution.decisionReason || '' });
    return;
  }
  const unknownBrandCandidates = (resolution.candidates || []).filter(c => Number(c.brandSimilarity || 0) >= 0.55 || Number(c.nameSimilarity || 0) >= 0.86);
  if (resolution.state === 'candidate_list' && resolution.decisionReason === 'unknown_brand') {
    if (unknownBrandCandidates.length) {
      showSuggestions(unknownBrandCandidates.slice(0, 7), {
        confirmMode: false,
        meta: {
          query,
          normalizedQuery: resolution.normalizedQuery || normalizeQuery(query),
          selectionContext: 'suggestions',
          decisionReason: resolution.decisionReason || ''
        }
      });
      setSearchState('results', { query });
      return;
    }
    showCandidateStatusMessage('No close match yet. Add a product URL below for fast indexing.');
    showAddProductCapture({
      query,
      normalizedQuery: resolution.normalizedQuery || normalizeQuery(query),
      decisionReason: 'unknown_brand'
    });
    setSearchState('unknown_brand_no_candidates', { query });
    return;
  }
  if (resolution.state === 'candidate_list' && resolution.candidates?.length) {
    showSuggestions(resolution.candidates.slice(0, 7), {
      confirmMode: false,
      meta: {
        query,
        normalizedQuery: resolution.normalizedQuery || normalizeQuery(query),
        selectionContext: 'suggestions',
        decisionReason: resolution.decisionReason || ''
      }
    });
    setSearchState('results', { query });
    return;
  }
  setSearchState('empty', { query });
  trackEvent('search_no_match', { query, decisionReason: resolution.decisionReason || '' });
}

async function pollIngredientsStatus(product, maxWaitMs = 8000, intervalMs = 1500) {
  if (!product?.productId) return null;
  const started = Date.now();
  while (Date.now() - started <= maxWaitMs) {
    try {
      const res = await fetch(resolverUrl(`/resolver/products/${encodeURIComponent(product.productId)}/ingredients-status`));
      if (res.ok) {
        const data = await res.json();
        if (data?.state === 'available' && data.ingredientsText) {
          return {
            ...product,
            ingredientsText: data.ingredientsText,
            ingredientsStatus: 'available',
            ingredientResolutionState: 'available',
            ingredientFailureStage: ''
          };
        }
        if (data?.state === 'unavailable_final' || data?.state === 'unavailable_retryable') {
          return { ...product, ingredientResolutionState: data.state, ingredientFailureStage: data.failureStage || '' };
        }
      }
    } catch (_) {}
    await new Promise(resolve => setTimeout(resolve, intervalMs));
  }
  return null;
}
async function tryBackendIngredientResolution(product, queryText = '', options = {}) {
  if (!product?.productId) return null;
  try {
    const kickoff = await fetch(resolverUrl('/resolver/enrich-ingredients'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        productId: product.productId,
        query: queryText || [product.brand, product.name].filter(Boolean).join(' ').trim(),
        forceRetry: !!options.forceRetry,
        locale: navigator.language || 'en-US',
        region: ((navigator.language || 'en-US').split('-')[1] || '').toUpperCase()
      })
    });
    if (kickoff.ok) {
      const data = await kickoff.json();
      if (data?.ingredientResolutionState === 'available') return pollIngredientsStatus(product, 1200, 600);
    }
  } catch (_) {}
  return pollIngredientsStatus(product, 20000, 1500);
}

async function pickProduct(i) {

  const feedbackBase = {
    query: lastSuggestionMeta?.query || productInput.value.trim() || [p.brand, p.name].filter(Boolean).join(' '),
    normalizedQuery: lastSuggestionMeta?.normalizedQuery || normalizeQuery(lastSuggestionMeta?.query || productInput.value.trim() || [p.brand, p.name].filter(Boolean).join(' ')),
    shownCandidateProductIds: Array.isArray(lastSuggestionMeta?.shownCandidateProductIds)
      ? lastSuggestionMeta.shownCandidateProductIds
      : (suggestionsEl._products || []).map(x => x.productId).filter(Boolean).slice(0, 10),
    selectedProductId: p.productId || '',
    selectionContext: lastSuggestionMeta?.selectionContext || 'suggestions'
  };
  const sendSelectionFeedback = (analysisStarted, analysisSucceeded) => {
    sendCandidateSelectionFeedback({
      ...feedbackBase,
      analysisStarted: !!analysisStarted,
      analysisSucceeded: !!analysisSucceeded
    });
  };

  selectedProduct = {...p};
  productInput.value = p.name + (p.brand ? ' — ' + p.brand : '');
  hideSuggestions();
  document.getElementById('inputSection').style.display = 'none';
  document.getElementById('loading').classList.add('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';

  if (p.ingredientsText) {
    sendSelectionFeedback(true, true);
    trackEvent('product_confirmation_accepted', { name: p.name });
    await runAnalysis(p.name, p.brand || '', p.ingredientsText, 'resolver', p.img || '', p.category || '');
    return;
  }

  setLoading('Fetching product details…', p.name || '');
  const enriched = await enrichCandidateIngredients(p);
  if (enriched?.ingredientsText) {
    sendSelectionFeedback(true, true);
    trackEvent('product_confirmation_accepted', { name: enriched.name || p.name });
    await runAnalysis(enriched.name || p.name, enriched.brand || p.brand || '', enriched.ingredientsText, 'resolver', enriched.img || p.img || '', enriched.category || p.category || '');
    return;
  }
  sendSelectionFeedback(false, false);
  showProductNeedsIngredients(p);
}

async function resolveIngredientsDirectSources(product) {
  const q = [product?.brand, product?.name].filter(Boolean).join(' ').trim() || String(product?.name || '').trim();
  if (!q) return null;

  const tasks = [
    (async () => {
      try {
        const obf = await searchOBF(q);
        const best = (obf || []).find(x => String(x.ingredientsText || '').trim().length > 20);
        if (!best) return null;
        return {
          ...product,
          name: best.name || product.name,
          brand: best.brand || product.brand || '',
          category: best.category || product.category || '',
          img: best.img || product.img || '',
          ingredientsText: best.ingredientsText,
          ingredientsStatus: 'available',
          source: 'obf-direct'
        };
      } catch (_) {
        return null;
      }
    })(),
    (async () => {
      try {
        const inci = await fetchInciIngredients(q, true);
        if (!inci?.ingredients) return null;
        return {
          ...product,
          name: inci.productName || product.name,
          brand: inci.brand || product.brand || '',
          ingredientsText: inci.ingredients,
          ingredientsStatus: 'available',
          source: 'inci-direct'
        };
      } catch (_) {
        return null;
      }
    })()
  ];

  const settled = await Promise.allSettled(tasks);
  for (const item of settled) {
    if (item.status === 'fulfilled' && item.value?.ingredientsText) return item.value;
  }
  return null;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SCORING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function coverageConfidence(totalIngredients, unknownCount) {
  if (totalIngredients === 0) return { pct: 1, label: 'High', cap: null };
  const pct = (totalIngredients - unknownCount) / totalIngredients;
  if (pct >= 0.90) return { pct, label: 'High',       cap: null };
  if (pct >= 0.75) return { pct, label: 'Medium',     cap: 4.5  };
  if (pct >= 0.60) return { pct, label: 'Medium',     cap: 3.5  };
  return               { pct, label: 'Low',        cap: 2.5  };
}

function overallScore(cats, unknownCount, totalIngredients) {
  if (!cats.length) return 5;
  // Weighted average of safety scores (higher = safer)
  const weighted = cats.reduce((sum, c) => sum + c.score * c.weight, 0);
  const totalW   = cats.reduce((sum, c) => sum + c.weight, 0);
  const avg = parseFloat((weighted / totalW).toFixed(1));
  // Floor: overall can't exceed the worst category by more than 1 point
  const minCat = Math.min(...cats.map(c => c.score));
  let score = Math.min(avg, minCat + 1);
  const uncappedScore = score;
  // Coverage cap: incomplete analysis limits maximum confidence
  const { cap } = coverageConfidence(totalIngredients || 0, unknownCount || 0);
  // Unknowns reduce confidence, but should not drag verdict down by >1 step on their own.
  if (cap !== null) score = Math.min(score, Math.max(cap, uncappedScore - 1.0));
  return parseFloat(score.toFixed(1));
}
function verdictFromScore(s) {
  // s is now a safety score: 5=excellent, 1=avoid
  if (s >= 4) return 'safe';
  if (s >= 3) return 'caution';
  return 'avoid';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INGREDIENT CHECK — DATABASE FIRST
// Instant lookup from 1998-ingredient local DB.
// Unknown ingredients flagged for Google Search.
// No API call needed for this step.
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function claudeIngredientCheck(ingredients, skinTypes) {
  const acne = [], sensitive = [], dry = [], allergens = [], unknown = [];
  const normalAcne = [], normalSensitive = [], normalDry = [];
  const matchTypeCounts = { exact: 0, synonym: 0, family: 0, generic_extract: 0, unknown: 0 };

  // Reason helpers
  const acneReason = (d) => {
    if (d.acne >= 5) return 'highly comedogenic (Fulton scale 5)';
    if (d.acne === 4) return 'comedogenic (Fulton scale 4)';
    if (d.acne === 3) return 'moderately comedogenic (Fulton scale 3)';
    return 'mildly comedogenic (Fulton scale 2)';
  };
  const occlusiveNote = (d) => d.func && (d.func.includes('occlusive') || d.func.includes('wax'))
    ? ' / heavy occlusive' : '';

  for (const ing of ingredients) {
    const resolved = resolveIngredient(ing);
    const d = resolved.data;
    const matchType = resolved.matchType || 'unknown';
    if (matchTypeCounts[matchType] !== undefined) matchTypeCounts[matchType] += 1;
    if (!d) {
      unknown.push(ing);
      continue;
    }

    // Acne-prone
    if (skinTypes.includes('acne-prone') && d.acne >= 2) {
      const sev = d.acne >= 4 ? 'high' : d.acne === 3 ? 'mid' : 'low';
      acne.push({
        name: ing,
        severity: sev,
        acneVal: d.acne,
        reason: acneReason(d) + occlusiveNote(d)
      });
    } else if (skinTypes.includes('acne-prone') && d.func && d.acne >= 1 &&
               (d.func.includes('occlusive') || d.func.includes('wax'))) {
      // Only flag occlusives/waxes that have some comedogenic signal (acne>=1)
      // Petrolatum, mineral oil, silicones (acne=0) are non-comedogenic — not shown
      acne.push({ name: ing, severity: 'low', acneVal: d.acne, reason: 'mildly comedogenic wax — Fulton scale 1' });
    }
    if (d.acne >= 3) {
      normalAcne.push({
        name: ing,
        severity: d.acne >= 4 ? 'high' : 'mid',
        acneVal: d.acne,
        reason: d.acne >= 4 ? 'higher comedogenic signal for general skin' : 'moderate comedogenic signal for general skin'
      });
    }

    // Sensitive skin
    if (skinTypes.includes('sensitive') && d.irr >= 1) {
      sensitive.push({
        name: ing,
        severity: d.irr >= 2 ? 'high' : 'mid',
        reason: d.irr >= 2
          ? 'known significant irritant / sensitiser'
          : 'mild irritant — watch for redness'
      });
    }
    if (d.irr >= 2 || d.safe === false) {
      normalSensitive.push({
        name: ing,
        severity: 'high',
        reason: d.safe === false ? 'known safety concern' : 'strong irritant potential for general skin'
      });
    }

    // Dry skin
    if (skinTypes.includes('dry') && d.dry >= 1) {
      dry.push({
        name: ing,
        severity: d.dry >= 2 ? 'high' : 'mid',
        reason: d.dry >= 2
          ? 'significantly drying / stripping'
          : 'mildly drying'
      });
    }
    if (d.dry >= 2) {
      normalDry.push({
        name: ing,
        severity: 'high',
        reason: 'strong drying potential for general skin'
      });
    }

    // EU allergens — always checked
    if (d.al) {
      allergens.push({
        name: ing,
        severity: 'high',
        reason: 'EU Regulation 1223/2009 fragrance allergen'
      });
    }

    // Known unsafe ingredients
    if (d.safe === false) {
      sensitive.push({
        name: ing,
        severity: 'high',
        reason: 'banned / restricted ingredient — safety concern'
      });
    }
  }

  // Attach unknown list for rendering (not part of standard schema but won't break anything)
  const result = { acne, sensitive, dry, allergens, normalAcne, normalSensitive, normalDry };
  if (unknown.length) result._unknown = unknown;
  result._matchTypeCounts = matchTypeCounts;
  console.log(`[dbCheck] ${ingredients.length} ingredients: ${ingredients.length - unknown.length} in DB, ${unknown.length} unknown`);
  return result;  // synchronous — no await needed
}

// ── Chemist's note: pure narrative, runs after render ──
async function getChemistNote(productName, ingredients, verdict, skinTypes, aiFlags) {
  const skinList = skinTypes.join(', ') || 'general skin';
  // Pass the AI flags as context so the note doesn't repeat what the rows already say
  const flagSummary = aiFlags
    ? Object.entries(aiFlags)
        .filter(([k]) => k !== 'notes')
        .flatMap(([, arr]) => (arr || []).map(f => f.name))
        .filter((v, i, a) => a.indexOf(v) === i)
        .slice(0, 10)
        .join(', ')
    : '';
  try {
    const res = await fetch(apiUrl(), {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 300,
        messages: [{ role: 'user', content:
          `You are a cosmetic chemist. Write a brief chemist's note for someone with ${skinList} skin.

Product: ${productName}
Overall verdict: ${verdict} (${verdict === 'safe' ? 'low risk' : verdict === 'caution' ? 'moderate risk — some concerns' : 'high risk — notable concerns'})
Flagged ingredients: ${flagSummary || 'none identified'}
First 20 ingredients (by concentration): ${ingredients.slice(0,20).join(', ')}

Rules:
- Your note MUST be consistent with the verdict above — do not suggest the product is safer or riskier than stated
- 2 sentences maximum
- Focus on the single most useful action or watch-out for this specific skin type
- Do not list the flagged ingredients again — the user already sees them
- No marketing language, no general skincare advice
- You may use **bold** for a single ingredient name or a short "Tip:" label`
        }]
      })
    });
    const data = await res.json();
    return data.content?.[0]?.text || null;
  } catch(e) { return null; }
}

// ── isPastedIngredientList: distinguish pasted INCI list from a product name ──
// Requires: 3+ commas AND average token length < 32 chars (INCI names are short).
// This prevents "La Roche-Posay Toleriane Double Repair Face Moisturizer, SPF 30"
// (1 comma, long tokens) from being misread as an ingredient list.
function isPastedIngredientList(text) {
  const commas = (text.match(/,/g) || []).length;
  if (commas < 3) return false;
  const tokens = text.split(',').map(t => t.trim()).filter(Boolean);
  const avgLen = tokens.reduce((s, t) => s + t.length, 0) / tokens.length;
  return avgLen < 32;  // INCI names average ~12 chars; product names much longer
}
